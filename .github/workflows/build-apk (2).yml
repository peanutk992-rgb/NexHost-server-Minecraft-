          @contextmanager
          def saved_world():
              """Selama blok ini dunia sudah di-flush ke disk dan penyimpanan otomatis dimatikan (aman disalin)."""
              running = server_state()["state"] == "running"
              if running:
                  mark = TAILER.last_id()
                  send_cmd("save-off")
                  send_cmd("save-all flush")
                  TAILER.wait_for("Saved the game", mark, 25)
              try:
                  yield
              finally:
                  if running:
                      try:
                          send_cmd("save-on")
                      except ApiError:
                          pass


          def create_backup(kind="manual", with_plugins=True):
              BACKUPS.mkdir(parents=True, exist_ok=True)
              name = f"{kind}-{time.strftime('%Y%m%d-%H%M%S')}.tar.gz"
              try:
                  with saved_world(), tarfile.open(BACKUPS / name, "w:gz") as tar:
                      for p in backup_members(with_plugins):
                          tar.add(p, arcname=p.relative_to(SERVER).as_posix(), filter=_tar_filter)
              except Exception:
                  (BACKUPS / name).unlink(missing_ok=True)
                  raise
              return {"name": name, "size": (BACKUPS / name).stat().st_size}


          def list_backups():
              BACKUPS.mkdir(parents=True, exist_ok=True)
              out = [{"name": p.name, "size": p.stat().st_size, "mtime": int(p.stat().st_mtime)}
                     for p in BACKUPS.glob("*.tar.gz")]
              return sorted(out, key=lambda x: -x["mtime"])


          def prune_backups():
              keep = to_int(load_cfg()["backup_keep"], 5)
              autos = [b for b in list_backups() if b["name"].startswith("auto-")]
              for b in autos[keep:] if keep > 0 else []:
                  (BACKUPS / b["name"]).unlink(missing_ok=True)


          def restore_backup(name):
              if not backup_name_ok(name) or not (BACKUPS / name).is_file():
                  raise ApiError(404, "Backup tidak ditemukan")
              if server_state()["state"] != "stopped":
                  raise ApiError(409, "Matikan server dulu sebelum restore")
              with tarfile.open(BACKUPS / name, "r:gz") as tar:
                  members = tar.getmembers()
                  for m in members:
                      if m.name.startswith("/") or ".." in Path(m.name).parts or m.issym() or m.islnk() or m.isdev():
                          raise ApiError(400, f"Backup berisi path berbahaya: {m.name}")
                  tops = {Path(m.name).parts[0] for m in members if Path(m.name).parts}
                  aside = SERVER / "_before-restore"
                  shutil.rmtree(aside, ignore_errors=True)
                  aside.mkdir(parents=True, exist_ok=True)
                  for t in tops:
                      if t != "plugins" and (SERVER / t).exists():
                          shutil.move(str(SERVER / t), str(aside / t))
                  kw = {"filter": "data"} if hasattr(tarfile, "data_filter") else {}
                  tar.extractall(SERVER, members=members, **kw)
              return {"restored": sorted(tops)}


          # ───────────────────────── dunia ─────────────────────────
          WORLD_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_.\-]{0,39}$")
          DIMS = ("_nether", "_the_end")
          RESERVED = {"plugins", "mods", "logs", "config", "libraries", "versions", "cache", "crash-reports", "datapacks",
                      "resourcepacks", "backups", "panel", "tunnel"}
          LEVEL_TYPES = {"default": ("minecraft:normal", "DEFAULT"), "flat": ("minecraft:flat", "FLAT"),
                         "large_biomes": ("minecraft:large_biomes", "LARGEBIOMES"), "amplified": ("minecraft:amplified", "AMPLIFIED")}


          def active_world():
              return read_props().get("level-name") or "world"


          def need_stopped(msg):
              if server_state()["state"] != "stopped":
                  raise ApiError(409, msg)


          def world_paths(name):
              return [p for p in (SERVER / name, *(SERVER / (name + s) for s in DIMS)) if p.is_dir() and not p.is_symlink()]


          def dir_size(p):
              n = 0
              for root, _d, files in os.walk(p):
                  for f in files:
                      try:
                          n += os.lstat(os.path.join(root, f)).st_size
                      except OSError:
                          pass
              return n


          def list_worlds():
              act, out, seen = active_world(), [], set()
              for p in sorted(SERVER.iterdir(), key=lambda x: x.name.lower()):
                  if not (p.is_dir() and not p.is_symlink() and WORLD_RE.match(p.name) and p.name.lower() not in RESERVED
                          and (p / "level.dat").is_file()):
                      continue
                  if any(p.name.endswith(s) and (SERVER / p.name[:-len(s)]).is_dir() for s in DIMS):
                      continue  # ini folder Nether/End milik dunia lain
                  seen.add(p.name)
                  ps = world_paths(p.name)
                  out.append({"name": p.name, "active": p.name == act, "size": sum(dir_size(x) for x in ps),
                              "mtime": int((p / "level.dat").stat().st_mtime), "dims": [x.name for x in ps[1:]]})
              if act not in seen:
                  out.insert(0, {"name": act, "active": True, "size": 0, "mtime": 0, "dims": [], "missing": True})
              return out


          def check_world_name(name):
              name = str(name or "").strip()
              if not WORLD_RE.match(name) or name.lower() in RESERVED or any(name.endswith(s) for s in DIMS):
                  raise ApiError(400, "Nama dunia 1-40 karakter (huruf, angka, titik, minus, garis bawah), dan tidak boleh nama folder sistem")
              return name


          def level_type_value(kind):
              new, old = LEVEL_TYPES[kind]
              v = mc_version()
              return old if is_rel(v) and vkey(v) < (1, 16) else new


          def world_new(name, seed="", kind="default"):
              need_stopped("Matikan server dulu sebelum membuat dunia baru")
              name = check_world_name(name)
              if kind not in LEVEL_TYPES:
                  raise ApiError(400, "Tipe dunia tidak dikenal")
              seed = str(seed or "").strip()
              if len(seed) > 40 or re.search(r"[\r\n\x00]", seed):
                  raise ApiError(400, "Seed maksimal 40 karakter")
              if (SERVER / name / "level.dat").exists():
                  raise ApiError(409, "Dunia dengan nama itu sudah ada. Pakai 'Jadikan aktif'.")
              write_props({"level-name": name, "level-seed": seed, "level-type": level_type_value(kind)})
              return {"name": name, "note": "Dunia dibuat saat server dijalankan berikutnya."}


          def world_activate(name):
              need_stopped("Matikan server dulu sebelum mengganti dunia")
              name = check_world_name(name)
              if not (SERVER / name / "level.dat").is_file():
                  raise ApiError(404, "Dunia tidak ditemukan")
              write_props({"level-name": name})
              return {"name": name}


          def world_delete(name):
              need_stopped("Matikan server dulu sebelum menghapus dunia")
              name = check_world_name(name)
              if name == active_world():
                  raise ApiError(409, "Dunia yang sedang aktif tidak bisa dihapus. Aktifkan dunia lain dulu.")
              ps = world_paths(name)
              if not ps:
                  raise ApiError(404, "Dunia tidak ditemukan")
              for x in ps:
                  shutil.rmtree(x)
              return {"deleted": name}


          def world_reset(seed=None):
              need_stopped("Matikan server dulu sebelum mereset dunia")
              act = active_world()
              ps = world_paths(act)
              if not ps:
                  raise ApiError(404, "Dunia aktif belum dibuat")
              dest = SERVER / "_before-reset" / f"{act}-{time.strftime('%Y%m%d-%H%M%S')}"
              dest.mkdir(parents=True)
              for x in ps:
                  shutil.move(str(x), str(dest / x.name))
              if seed is not None:
                  seed = str(seed).strip()
                  if len(seed) > 40 or re.search(r"[\r\n\x00]", seed):
                      raise ApiError(400, "Seed maksimal 40 karakter")
                  write_props({"level-seed": seed})
              return {"moved_to": dest.relative_to(SERVER).as_posix()}


          def import_world_zip(zpath, want_name, activate):
              """Pasang dunia dari .zip (level.dat boleh di akar zip atau di dalam satu folder). Aman terhadap zip jahat."""
              try:
                  zf = zipfile.ZipFile(zpath)
              except zipfile.BadZipFile:
                  raise ApiError(400, "File bukan zip yang valid")
              with zf:
                  infos = []
                  for i in zf.infolist():
                      n = i.filename.replace("\\", "/")
                      if n.startswith("__MACOSX/") or n.endswith("/.DS_Store"):
                          continue
                      if n.startswith("/") or re.match(r"^[A-Za-z]:", n) or ".." in n.split("/") or re.search(r"[\x00-\x1f]", n):
                          raise ApiError(400, f"Zip berisi path berbahaya: {n[:80]}")
                      if (i.external_attr >> 16) & 0o170000 == 0o120000:
                          raise ApiError(400, "Zip berisi symlink, ditolak")
                      infos.append((n, i))
                  if len(infos) > 300_000:
                      raise ApiError(413, "Zip berisi terlalu banyak file")
                  roots = sorted((n for n, _ in infos if n == "level.dat" or n.endswith("/level.dat")), key=lambda n: n.count("/"))
                  if not roots or roots[0].count("/") > 2:
                      raise ApiError(400, "level.dat tidak ketemu di zip. Ini bukan dunia Minecraft Java (dunia Bedrock .mcworld tidak bisa dipakai di sini).")
                  prefix = roots[0][:-len("level.dat")]
                  free = shutil.disk_usage(SERVER).free
                  limit = max(0, min(free - 200 * 1048576, 16 * 1073741824))
                  if sum(i.file_size for n, i in infos if n.startswith(prefix)) > limit:
                      raise ApiError(413, "Ruang penyimpanan tidak cukup untuk dunia ini")
                  base = prefix.rstrip("/").split("/")[-1] if prefix else ""
                  explicit = bool(want_name)
                  name = want_name or (base if WORLD_RE.match(base or "") else "") or "world-import"
                  name = check_world_name(name)
                  if (SERVER / name).exists() and explicit:
                      raise ApiError(409, f"Folder '{name}' sudah ada. Hapus dulu atau pakai nama lain.")
                  k, orig = 2, name
                  while (SERVER / name).exists():
                      name, k = f"{orig}-{k}", k + 1
                  tmpd = SERVER / f"_upload-{secrets.token_hex(4)}"
                  tmpd.mkdir(parents=True)
                  written, files = 0, 0
                  try:
                      for n, i in infos:
                          if not n.startswith(prefix):
                              continue
                          rel = n[len(prefix):]
                          if not rel or rel.endswith("/"):
                              if rel:
                                  (tmpd / rel).mkdir(parents=True, exist_ok=True)
                              continue
                          if rel.endswith("session.lock"):
                              continue
                          target = (tmpd / rel).resolve()
                          if tmpd.resolve() not in target.parents:
                              raise ApiError(400, "Zip berisi path berbahaya")
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(i) as src, open(target, "wb") as out:
                              while True:
                                  ch = src.read(1 << 16)
                                  if not ch:
                                      break
                                  written += len(ch)
                                  if written > limit:
                                      raise ApiError(413, "Isi zip melebihi batas ukuran")
                                  out.write(ch)
                          files += 1
                      os.replace(tmpd, SERVER / name)
                  finally:
                      shutil.rmtree(tmpd, ignore_errors=True)
              if activate:
                  write_props({"level-name": name})
              return {"name": name, "files": files, "size": written, "activated": bool(activate)}


          def export_world_zip(name):
              name = check_world_name(name)
              ps = world_paths(name)
              if not ps:
                  raise ApiError(404, "Dunia tidak ditemukan")
              BACKUPS.mkdir(parents=True, exist_ok=True)
              for old in BACKUPS.glob(".world-*.zip"):
                  if time.time() - old.stat().st_mtime > 3600:
                      old.unlink(missing_ok=True)
              tmp = BACKUPS / f".world-{name}-{secrets.token_hex(3)}.zip"
              try:
                  with saved_world(), zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED, compresslevel=1) as z:
                      for base in ps:
                          for root, dirs, files in os.walk(base):
                              dirs[:] = [d for d in dirs if not os.path.islink(os.path.join(root, d))]
                              for f in files:
                                  fp = Path(root) / f
                                  if f == "session.lock" or fp.is_symlink():
                                      continue
                                  z.write(fp, (Path(base.name) / fp.relative_to(base)).as_posix())
              except Exception:
                  tmp.unlink(missing_ok=True)
                  raise
              return tmp


          # ───────────────────────── alamat join ─────────────────────────
          _pubip = {"ip": None, "t": 0.0}


          def is_ip(s):
              for fam in (socket.AF_INET, socket.AF_INET6):
                  try:
                      socket.inet_pton(fam, s)
                      return True
                  except OSError:
                      pass
              return False


          def public_ip(force=False):
              """IP publik HP ini (dari layanan luar). None kalau offline."""
              if not force and _pubip["ip"] and time.time() - _pubip["t"] < 600:
                  return _pubip["ip"]
              try:
                  with http_open(IP_API, GENERIC_UA, 8) as r:
                      ip = r.read(100).decode("ascii", "replace").strip()
                  if not is_ip(ip):
                      return None
              except Exception:
                  return None
              _pubip.update(ip=ip, t=time.time())
              return ip


          def fmt_addr(host, port, default=25565):
              h = f"[{host}]" if ":" in host else host
              return h if port == default else f"{h}:{port}"


          def address_info():
              """Semua cara teman bisa join. Alamat localhost sengaja tidak pernah ditampilkan."""
              cf, pr = load_cfg(), read_props()
              jport = cf["public_java_port"] or to_int(pr.get("server-port"), 25565)
              bedrock_on = bool(geyser_installed()["geyser"])
              bport = (cf["public_bedrock_port"] or geyser_port()) if bedrock_on else None
              opts = []
              if cf["public_host"]:
                  h = cf["public_host"]
                  opts.append({"id": "domain", "label": "Domain kamu", "scope": "internet", "host": h, "java_port": jport,
                               "java": fmt_addr(h, jport), "bedrock_port": bport})
              try:
                  tun = tunnel_state()
              except ApiError:
                  tun = {"addresses": [], "running": False, "installed": False}
              for a in tun["addresses"]:
                  h, _, pt = a.partition(":")
                  opts.append({"id": "tunnel", "label": "Tunnel playit", "scope": "internet", "host": h,
                               "java_port": to_int(pt, 25565), "java": a if pt else fmt_addr(h, 25565), "bedrock_port": None})
              lan = lan_ip()
              if lan:
                  opts.append({"id": "lan", "label": "Wi-Fi yang sama", "scope": "wifi", "host": lan, "java_port": jport,
                               "java": fmt_addr(lan, jport), "bedrock_port": bport})
              return {"host": cf["public_host"], "java_port": jport, "bedrock_port": bport, "bedrock_enabled": bedrock_on,
                      "public_java_port": cf["public_java_port"], "public_bedrock_port": cf["public_bedrock_port"],
                      "options": opts, "primary": opts[0] if opts else None, "lan_ip": lan,
                      "tunnel": {"installed": tun["installed"], "running": tun["running"]},
                      "panel_url": f"http://{lan}:{cf['port']}" if cf["bind"] == "0.0.0.0" and lan else None}


          def doh(name, rtype):
              req = urllib.request.Request(DOH_URL + "?" + urllib.parse.urlencode({"name": name, "type": rtype}),
                                           headers={"Accept": "application/dns-json", "User-Agent": GENERIC_UA})
              with urllib.request.urlopen(req, timeout=8) as r:
                  return json.load(r)


          def dns_check(host=None):
              host = clean_host(host) if host else load_cfg()["public_host"]
              if not host:
                  raise ApiError(400, "Isi domain atau IP dulu")
              out = {"host": host, "a": [], "aaaa": [], "srv": [], "errors": []}
              try:
                  for fam, _t, _p, _c, sa in socket.getaddrinfo(host, None, type=socket.SOCK_STREAM):
                      ip = sa[0]
                      lst = out["a"] if fam == socket.AF_INET else out["aaaa"]
                      if ip not in lst:
                          lst.append(ip)
              except OSError as e:
                  out["errors"].append(f"Domain belum bisa di-resolve dari HP ini ({e}). DNS baru bisa butuh beberapa menit sampai beberapa jam.")
              if not is_ip(host):
                  try:
                      for a in (doh(f"_minecraft._tcp.{host}", "SRV").get("Answer") or []):
                          parts = str(a.get("data", "")).split()
                          if a.get("type") == 33 and len(parts) == 4:
                              out["srv"].append({"priority": to_int(parts[0], 0), "weight": to_int(parts[1], 0),
                                                 "port": to_int(parts[2], 0), "target": parts[3].rstrip(".")})
                  except Exception as e:
                      out["errors"].append(f"Cek record SRV butuh internet ({getattr(e, 'reason', e)}).")
              pub = public_ip(True)
              out["public_ip"] = pub
              ips = out["a"] + out["aaaa"]
              out["matches_public_ip"] = (pub in ips) if pub and ips else None
              return out


          def prop_escape(v):
              """server.properties dibaca Java sebagai Latin-1, jadi karakter non-ASCII ditulis sebagai \\uXXXX."""
              return "".join(c if 32 <= ord(c) < 127 else "\\u%04x" % ord(c) for c in str(v))


          def prop_unescape(v):
              return re.sub(r"\\u([0-9a-fA-F]{4})", lambda m: chr(int(m.group(1), 16)), str(v))


          # ───────────────────────── tunnel playit ─────────────────────────
          def tunnel_state():
              pi = pane_info(S_TUN)
              out = ""
              if pi:
                  r = tmux("capture-pane", "-J", "-p", "-t", f"={S_TUN}:", "-S", "-120")
                  out = r.stdout if r.returncode == 0 else ""
              claim = re.search(r"https://playit\.gg/[^\s\"'<>]+", out)
              addrs = sorted(set(re.findall(r"\b[a-z0-9][a-z0-9\-.]*\.(?:joinmc\.link|ply\.gg|playit\.plus)(?::\d+)?\b", out)))
              return {"installed": (TUNNEL / "playit").exists(), "running": bool(pi and not pi["dead"]),
                      "claim": claim.group(0) if claim else None, "addresses": addrs, "output": out[-3000:],
                      "chroot": bool(shutil.which("termux-chroot"))}


          def install_playit():
              m = platform.machine().lower()
              names = {"aarch64": ["playit-linux-aarch64"], "arm64": ["playit-linux-aarch64"], "armv7l": ["playit-linux-armv7"],
                       "armv8l": ["playit-linux-armv7"], "x86_64": ["playit-linux-amd64", "playit-linux-x86_64"],
                       "amd64": ["playit-linux-amd64"]}.get(m)
              if not names:
                  raise ApiError(400, f"Arsitektur {m} belum didukung")
              err = None
              for n in names:
                  try:
                      download(f"{PLAYIT_URL}/{n}", TUNNEL / "playit", GENERIC_UA)
                      os.chmod(TUNNEL / "playit", 0o755)
                      return {"file": n}
                  except Exception as e:
                      err = e
              raise ApiError(502, f"Gagal mengunduh agent playit: {err}")


          def start_tunnel():
              exe = TUNNEL / "playit"
              if not exe.exists():
                  raise ApiError(400, "Agent playit belum dipasang")
              pi = pane_info(S_TUN)
              if pi and not pi["dead"]:
                  raise ApiError(409, "Tunnel sudah jalan")
              tmux("kill-session", "-t", f"={S_TUN}")
              cr = shutil.which("termux-chroot")
              cmd = (shlex.quote(cr) + " " if cr else "") + shlex.quote(str(exe))
              r = tmux("new-session", "-d", "-s", S_TUN, "-x", "200", "-y", "50", "-c", str(TUNNEL), cmd,
                       ";", "set-window-option", "-t", f"={S_TUN}:", "remain-on-exit", "on")
              if r.returncode:
                  raise ApiError(500, "Gagal menjalankan tunnel: " + r.stderr.strip())


          # ───────────────────────── watchdog ─────────────────────────
          def watchdog():
              restarts, last_check = [], 0
              while True:
                  time.sleep(5)
                  try:
                      c, st = load_cfg(), server_state()
                      if st["state"] == "stopped":
                          if st.get("crashed") and TAILER.flags()["stopping"]:
                              set_desired(False)
                          if get_desired() and c["auto_restart"]:
                              restarts = [t for t in restarts if time.time() - t < 600]
                              if len(restarts) < 3:
                                  restarts.append(time.time())
                                  TAILER.note("[panel] Server berhenti tiba-tiba, dijalankan ulang otomatis")
                                  start_server()
                              else:
                                  set_desired(False)
                                  TAILER.note("[panel] Server crash 3x dalam 10 menit, auto-restart dihentikan")
                      hrs = to_int(c["backup_every_h"], 0)
                      if hrs > 0 and time.time() - last_check > 60 and server_installed():
                          last_check = time.time()
                          autos = [b for b in list_backups() if b["name"].startswith("auto-")]
                          if not autos or time.time() - autos[0]["mtime"] > hrs * 3600:
                              create_backup("auto")
                              prune_backups()
                  except Exception:
                      traceback.print_exc()


          # ───────────────────────── HTTP ─────────────────────────
          ROUTES, SESSIONS, FAILS = {}, {}, {}


          def route(method, path, auth=True):
              def deco(fn):
                  ROUTES[(method, path)] = (fn, auth)
                  return fn
              return deco


          class Raw:
              def __init__(self, code=200, body=b"", ctype="application/json", headers=None, path=None, name=None, cleanup=False):
                  self.code, self.body, self.ctype, self.headers, self.path, self.name = code, body, ctype, headers or [], path, name
                  self.cleanup = cleanup

              def send(self, h):
                  if self.path:
                      size = self.path.stat().st_size
                      h.send_response(200)
                      h.send_header("Content-Type", "application/octet-stream")
                      h.send_header("Content-Length", str(size))
                      h.send_header("Content-Disposition", "attachment; filename*=UTF-8''" + urllib.parse.quote(self.name or self.path.name))
                      h.send_header("X-Content-Type-Options", "nosniff")
                      h.end_headers()
                      try:
                          with open(self.path, "rb") as f:
                              shutil.copyfileobj(f, h.wfile, 1 << 16)
                      finally:
                          if self.cleanup:
                              self.path.unlink(missing_ok=True)
                  else:
                      h._send(self.code, self.body, self.ctype, self.headers)


          class Ctx:
              def __init__(self, h, q, body):
                  self.h, self.q, self.body = h, q, body


          CSP = ("default-src 'self'; img-src 'self' https://cdn.modrinth.com data:; style-src 'self' 'unsafe-inline'; "
                 "script-src 'self'; frame-ancestors 'none'")


          class H(BaseHTTPRequestHandler):
              server_version = "NexHost"
              protocol_version = "HTTP/1.0"

              def log_message(self, *a):
                  pass

              def _send(self, code, body=b"", ctype="application/json", extra=None):
                  self.send_response(code)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("X-Content-Type-Options", "nosniff")
                  self.send_header("Content-Security-Policy", CSP)
                  for k, v in extra or []:
                      self.send_header(k, v)
                  self.end_headers()
                  if body and self.command != "HEAD":
                      self.wfile.write(body)

              def _json(self, code, obj):
                  self._send(code, json.dumps(obj).encode())

              def _host_ok(self):
                  if load_cfg()["bind"] != "127.0.0.1":
                      return True
                  host = (self.headers.get("Host") or "").rsplit(":", 1)[0].strip("[]")
                  return host in ("localhost", "127.0.0.1", "::1")

              def _authed(self):
                  m = re.search(r"(?:^|;\s*)mcp=([A-Za-z0-9_\-]+)", self.headers.get("Cookie", ""))
                  t = m and SESSIONS.get(m.group(1))
                  return bool(t and t > time.time())

              def _static(self, path):
                  if path == "/favicon.ico":
                      return self._send(204)
                  name = {"/": "index.html", "/index.html": "index.html", "/app.js": "app.js", "/app.css": "app.css"}.get(path)
                  p = STATIC / name if name else None
                  if not p or not p.is_file():
                      return self._send(404, b"Tidak ketemu", "text/plain; charset=utf-8")
                  ct = {"html": "text/html; charset=utf-8", "js": "text/javascript; charset=utf-8", "css": "text/css; charset=utf-8"}[name.rsplit(".", 1)[1]]
                  self._send(200, p.read_bytes(), ct)

              def handle_any(self):
                  try:
                      u = urllib.parse.urlsplit(self.path)
                      q = {k: v[0] for k, v in urllib.parse.parse_qs(u.query).items()}
                      if not self._host_ok():
                          return self._json(403, {"error": "Host tidak diizinkan"})
                      if not u.path.startswith("/api/"):
                          return self._static(u.path)
                      r = ROUTES.get((self.command, u.path))
                      if not r:
                          return self._json(404, {"error": "Endpoint tidak ada"})
                      fn, auth = r
                      if auth and not self._authed():
                          return self._json(401, {"error": "Belum login"})
                      if self.command != "GET" and self.headers.get("X-Panel") != "1":
                          return self._json(403, {"error": "Permintaan ditolak (header X-Panel hilang)"})
                      body = {}
                      if self.command == "POST":
                          n = to_int(self.headers.get("Content-Length"), 0)
                          if n > 5_000_000:
                              raise ApiError(413, "Isi permintaan terlalu besar")
                          raw = self.rfile.read(n) if n else b""
                          body = json.loads(raw) if raw else {}
                          if not isinstance(body, dict):
                              raise ApiError(400, "JSON harus berupa objek")
                      res = fn(Ctx(self, q, body))
                      if isinstance(res, Raw):
                          return res.send(self)
                      self._json(200, res if res is not None else {"ok": True})
                  except ApiError as e:
                      self._json(e.code, {"error": e.msg})
                  except urllib.error.HTTPError as e:
                      self._json(502, {"error": f"Server luar menjawab {e.code}: {e.url}"})
                  except urllib.error.URLError as e:
                      self._json(502, {"error": f"Tidak bisa terhubung ke server luar (cek internet): {e.reason}"})
                  except (json.JSONDecodeError, UnicodeDecodeError):
                      self._json(400, {"error": "JSON tidak valid"})
                  except (BrokenPipeError, ConnectionResetError):
                      pass
                  except Exception as e:
                      traceback.print_exc()
                      try:
                          self._json(500, {"error": f"Error internal: {e}"})
                      except Exception:
                          pass

              do_GET = do_POST = do_PUT = do_HEAD = handle_any


