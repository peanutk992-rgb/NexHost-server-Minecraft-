                restart) tmux kill-session -t "=$S" 2>/dev/null || true; sleep 1; panel_start ;;
                *) echo "Pakai: mc panel [start|stop|restart]" ;;
              esac ;;
            passwd) shift; python3 "$PY" passwd "$@" ;;
            update) shift; python3 "$PY" install-paper "$@" ;;
            install) shift; python3 "$PY" install-server "$@" ;;
            address) python3 "$PY" address ;;
            geyser) python3 "$PY" install-geyser ;;
            backup) python3 "$PY" backup ;;
            tunnel) shift; python3 "$PY" tunnel "${1:-show}" ;;
            config) shift; python3 "$PY" config "$@" ;;
            lan) python3 "$PY" config set bind 0.0.0.0; "$0" panel restart; echo "Panel bisa dibuka dari Wi-Fi: http://IP-HP:$(panel_port) (pakai password)" ;;
