                  loading ? h('p', {}, 'Memuat daftar versi…') : h('div', { class: 'vers' }, list.map(v => h('button', { class: 'vbtn' + (pick === v.id ? ' on' : ''), onclick: () => { pick = v.id; draw(); } }, v.id, v.type === 'snapshot' ? h('small', {}, ' snap') : null))),
                  h('div', { class: 'row', style: 'margin-top:12px' },
                    h('button', {
                      class: 'btn primary', onclick: ev => run(async () => {
                        const r = await api('POST', '/api/server/install', { software: sw, version: pick }); info.current = r.software; info.version = r.version; info.software_name = (info.software.find(x => x.id === r.software) || {}).name;
                        if (!r.java_ok) toast('Java ' + r.java + ' belum terpasang. Di Termux: pkg install openjdk-' + r.java, true);
                        if (r.note) toast(r.note, true);
                        draw(); return r;
                      }, r => r.software + ' ' + r.version + ' terpasang', ev.currentTarget)
                    }, pick ? 'Pasang ' + pick : 'Pasang versi terbaru')),
                  h('p', { class: 'small' }, 'Buat backup dulu. Plugin atau mod lama bisa tidak cocok dengan versi baru. Versi di bawah 1.17 memakai Java 17 dan hasilnya tidak dijamin.')));
            };
            const fetchV = async () => {
              loading = true; draw();
              try { list = (await api('GET', '/api/server/versions?software=' + sw + (snaps ? '&snapshots=1' : ''))).versions; } catch (e) { list = []; toast(e.message, true); }
              loading = false; draw();
            };
            (async () => {
              try { info = await api('GET', '/api/server/software'); } catch (e) { toast(e.message, true); return; }
              info.software_name = (info.software.find(x => x.id === info.current) || {}).name;
