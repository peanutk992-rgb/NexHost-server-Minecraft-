          // ─────────── Alamat
          function pageAddress() {
            const box = h('div', { class: 'stack' });
            $('#view').replaceChildren(box);
            S.onStatus = () => {};
            const load = async () => {
              let a, st;
              try { [a, st] = await Promise.all([api('GET', '/api/address'), api('GET', '/api/status')]); } catch (e) { toast(e.message, true); return; }
              S.addr = a;
              const host = h('input', { class: 'inp mono', value: a.host, placeholder: 'servermc.play.id', autocapitalize: 'off', spellcheck: 'false' });
              const jp = h('input', { class: 'inp', type: 'number', value: a.public_java_port || '', placeholder: String(a.java_port) });
              const bp = h('input', { class: 'inp', type: 'number', value: a.public_bedrock_port || '', placeholder: String(a.bedrock_port || 19132) });
              const res = h('div', {});
              const check = async ev => {
                ev.currentTarget.disabled = true;
                try {
                  const r = await api('POST', '/api/address/check', { host: host.value.trim() });
                  res.replaceChildren(
                    r.a.length || r.aaaa.length ? note(r.matches_public_ip === false ? 'bad' : 'ok', 'Domain mengarah ke ' + r.a.concat(r.aaaa).join(', ') + (r.public_ip ? '. IP publik HP ini: ' + r.public_ip : '') + (r.matches_public_ip === false ? '. IP tidak sama, wajar kalau kamu pakai tunnel atau hosting lain.' : r.matches_public_ip ? '. Cocok.' : ''))
                      : note('bad', 'Domain belum mengarah ke IP mana pun.'),
                    r.srv.length ? note('ok', 'Record SRV: ' + r.srv.map(x => x.target + ':' + x.port).join(', ')) : note('', 'Tidak ada record SRV. Tanpa SRV, pemain Java memakai port 25565 kecuali kamu tulis port di alamat.'),
                    r.errors.map(e => note('', e)));
                } catch (e) { toast(e.message, true); } finally { ev.currentTarget.disabled = false; }
              };
              box.replaceChildren(head('Alamat server', 'Alamat yang dibagikan ke teman'),
                card('Cara teman join', a.options.length ? a.options.map(o => h('div', { class: 'opt' }, h('div', { class: 'row sp' }, h('b', {}, o.label), h('span', { class: 'chip ' + (o.scope === 'internet' ? 'j' : 'w') }, o.scope === 'internet' ? 'dari mana saja' : 'satu Wi-Fi')), joinLines(o)))
                  : h('p', {}, 'Belum ada alamat. Isi domain di bawah, jalankan tunnel, atau sambungkan HP ke Wi-Fi.'),
                a.panel_url ? h('p', { class: 'small' }, 'Panel ini bisa dibuka dari perangkat lain di ', h('code', {}, a.panel_url)) : null),
                card('Domain atau IP sendiri',
                  h('p', {}, 'Isi domain yang kamu punya, misalnya servermc.play.id, atau IP publik. NexHost menyimpan dan menampilkannya, tapi tidak membeli atau mengatur domain.'),
                  h('label', { class: 'f' }, 'Domain atau IP'), host,
                  h('div', { class: 'grid2' }, h('div', {}, h('label', { class: 'f' }, 'Port Java (kosong = ikut server)'), jp), h('div', {}, h('label', { class: 'f' }, 'Port Bedrock (UDP)'), bp)),
                  h('div', { class: 'row', style: 'margin-top:12px' },
                    h('button', { class: 'btn primary', onclick: act(async () => { await api('POST', '/api/settings', { public_host: host.value.trim(), public_java_port: jp.value || 0, public_bedrock_port: bp.value || 0 }); await load(); }, 'Alamat tersimpan') }, 'Simpan'),
                    h('button', { class: 'btn', onclick: check }, 'Cek DNS')), res),
                card('Supaya domain berfungsi',
                  h('ol', { class: 'steps' },
                    h('li', {}, 'Di pengelola domain, buat record A yang mengarah ke IP publik HP ini' + (a.lan_ip ? '' : '') + ', atau CNAME ke alamat tunnel playit.'),
                    h('li', {}, 'Port Java (' + a.java_port + ' TCP) dan Bedrock (UDP) harus bisa dijangkau dari internet: buka port di router, atau pakai tab Tunnel. Banyak jaringan seluler memblokir ini.'),
                    h('li', {}, 'Port bukan 25565? Buat record SRV _minecraft._tcp supaya pemain Java tidak perlu mengetik port. Bedrock tidak mendukung SRV, jadi isi host dan port manual.'))));
            };
            load();
          }

          // ─────────── Plugin / Mod
          function pagePlugins() {
            const inst = h('div'), found = h('div');
            $('#view').replaceChildren(h('div', { class: 'stack' }, inst, found));
            S.onStatus = () => {};
            const q = h('input', { class: 'inp', placeholder: 'Cari di Modrinth, mis. EssentialsX', enterkeyhint: 'search' });
            const compat = h('input', { type: 'checkbox', checked: true });
            const results = h('div', { class: 'list' });
            let kind = 'plugin', dir = 'plugins', word = 'Plugin';
            const load = async () => {
              try {
                const r = await api('GET', '/api/plugins');
                kind = r.kind; dir = r.dir; word = kind === 'mod' ? 'Mod' : 'Plugin';
                if (!kind) {
                  inst.replaceChildren(head('Plugin dan mod'), note('', 'Vanilla tidak mendukung plugin maupun mod. Ganti ke Paper, Purpur (plugin), atau Fabric (mod) di tab Versi.'));
                  found.replaceChildren();
                  return false;
                }
                inst.replaceChildren(head(word, 'Terpasang: ' + r.plugins.length, btnI('upload', 'Unggah .jar', { class: 'btn', onclick: () => pickFile('.jar', f => run(async () => { await upload(dir, f); await load(); }, word + ' diunggah. Restart server agar dimuat.')) })),
                  r.plugins.length ? h('div', { class: 'list' }, r.plugins.map(p => h('div', { class: 'it' },
                    h('div', { class: 'nm' }, h('b', {}, p.name), ' ', h('span', { class: 'mut small' }, p.version), h('div', { class: 'mut small' }, p.file + ', ' + fmtB(p.size) + (p.enabled ? '' : ', nonaktif'))),
                    h('button', { class: 'btn small', onclick: ev => run(async () => { await api('POST', '/api/plugins/toggle', { file: p.file }); await load(); }, 'Diubah. Restart server agar berlaku.', ev.currentTarget) }, p.enabled ? 'Nonaktifkan' : 'Aktifkan'),
                    h('button', { class: 'btn small danger', onclick: ev => confirm('Hapus ' + p.file + '?') && run(async () => { await api('POST', '/api/plugins/delete', { file: p.file }); await load(); }, 'Dihapus', ev.currentTarget) }, 'Hapus'))))
                    : h('p', {}, 'Belum ada ' + word.toLowerCase() + '.'),
                  h('p', { class: 'small' }, 'Dimuat saat server menyala. Setelah mengubahnya, restart server.'));
                return true;
              } catch (e) { toast(e.message, true); return false; }
            };
            const search = async () => {
              results.replaceChildren(h('p', {}, 'Mencari…'));
              try {
                const r = await api('GET', '/api/plugins/search?q=' + encodeURIComponent(q.value.trim()) + '&compat=' + (compat.checked ? 1 : 0));
                results.replaceChildren(...(r.hits.length ? r.hits.map(hit => h('div', { class: 'it' },
                  hit.icon && /^https:\/\/cdn\.modrinth\.com\//.test(hit.icon) ? h('img', { src: hit.icon, alt: '' }) : null,
                  h('div', { class: 'nm' }, h('b', {}, hit.title), h('div', { class: 'mut small' }, hit.desc)),
                  h('button', { class: 'btn small primary', onclick: ev => run(async () => { const x = await api('POST', '/api/plugins/install', { project: hit.id }); await load(); return x; }, x => 'Terpasang: ' + x.installed.join(', ') + '. Restart server.', ev.currentTarget) }, 'Pasang')))
                  : [h('p', {}, 'Tidak ada hasil. Coba matikan filter versi Minecraft.')]));
              } catch (e) { results.replaceChildren(note('bad', e.message)); }
            };
            q.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
            load().then(ok => {
              if (!ok) return;
              found.replaceChildren(card('Cari di Modrinth', q, h('label', { class: 'sw' }, compat, 'Hanya yang cocok dengan versi Minecraft server'),
                h('div', { class: 'row', style: 'margin:10px 0' }, h('button', { class: 'btn primary', onclick: search }, 'Cari')), results));
              search();
            });
          }

          // ─────────── File
          async function edit(path) {
            try {
              const r = await api('GET', '/api/files/read?path=' + encodeURIComponent(path));
              const ta = h('textarea', { spellcheck: 'false', class: 'mono', value: r.content });
              modal(path, ta, [{ label: 'Simpan', cls: 'primary', fn: async close => { await api('POST', '/api/files/write', { path, content: ta.value }); toast('Tersimpan. Restart server kalau ini file konfigurasi.'); close(); } }]);
            } catch (e) { toast(e.message, true); }
          }

          function pageFiles() {
            const box = h('div', { class: 'stack' });
            $('#view').replaceChildren(box);
            S.onStatus = () => {};
            let cur = '';
            const join = (a, b) => a ? a + '/' + b : b;
            const load = async p => { try { const r = await api('GET', '/api/files?path=' + encodeURIComponent(p)); cur = r.path; draw(r); } catch (e) { toast(e.message, true); } };
            const draw = r => {
              const parts = cur ? cur.split('/') : [];
              box.replaceChildren(head('File', 'Isi folder server'),
                card(null, h('div', { class: 'crumbs' }, h('a', { onclick: () => load('') }, 'server'), parts.map((p, i) => [' / ', h('a', { onclick: () => load(parts.slice(0, i + 1).join('/')) }, p)])),
                  h('div', { class: 'row', style: 'margin:8px 0' },
                    btnI('plus', 'Folder baru', { class: 'btn small', onclick: async () => { const n = prompt('Nama folder baru'); if (n) { await run(() => api('POST', '/api/files/mkdir', { path: join(cur, n) })); load(cur); } } }),
                    btnI('upload', 'Unggah file', { class: 'btn small', onclick: () => pickFile('', async f => { await run(() => upload(cur, f), 'Diunggah'); load(cur); }) })),
                  h('div', { class: 'list' },
                    cur ? h('div', { class: 'it' }, h('a', { class: 'nm', onclick: () => load(parts.slice(0, -1).join('/')) }, '.. naik satu folder')) : null,
                    r.items.map(it => h('div', { class: 'it' },
                      h('a', { class: 'nm', onclick: () => it.dir ? load(join(cur, it.name)) : edit(join(cur, it.name)) }, (it.dir ? '[folder] ' : '') + it.name),
                      h('span', { class: 'mut small' }, it.dir ? '' : fmtB(it.size)),
                      !it.dir && h('a', { class: 'btn small', href: '/api/files/download?path=' + encodeURIComponent(join(cur, it.name)) }, 'Unduh'),
                      h('button', { class: 'btn small', onclick: async () => { const n = prompt('Nama baru', it.name); if (n && n !== it.name) { await run(() => api('POST', '/api/files/rename', { path: join(cur, it.name), to: join(cur, n) })); load(cur); } } }, 'Ganti nama'),
                      h('button', { class: 'btn small danger', onclick: async () => { if (confirm('Hapus ' + it.name + (it.dir ? ' beserta isinya' : '') + '?')) { await run(() => api('POST', '/api/files/delete', { path: join(cur, it.name) }), 'Dihapus'); load(cur); } } }, 'Hapus'))))));
            };
            load('');
          }

          // ─────────── Backup
          function pageBackups() {
            const box = h('div', { class: 'stack' });
            $('#view').replaceChildren(box);
            S.onStatus = () => {};
            const plug = h('input', { type: 'checkbox', checked: true });
            const load = async () => {
              try {
                const r = await api('GET', '/api/backups');
                box.replaceChildren(head('Backup', 'Isi: dunia, pengaturan, OP, whitelist, ban. Aman dibuat saat server menyala.',
                  btnI('backups', 'Backup sekarang', { class: 'btn primary', onclick: ev => run(async () => { await api('POST', '/api/backups/create', { plugins: plug.checked }); await load(); }, 'Backup selesai', ev.currentTarget) })),
                  h('label', { class: 'sw' }, plug, 'Sertakan data plugin (tanpa file .jar)'),
                  card('Daftar backup (' + r.backups.length + ')', r.backups.length ? h('div', { class: 'list' }, r.backups.map(b => h('div', { class: 'it' },
                    h('div', { class: 'nm' }, b.name, h('div', { class: 'mut small' }, fmtT(b.mtime) + ', ' + fmtB(b.size))),
                    h('a', { class: 'btn small', href: '/api/backups/download?name=' + encodeURIComponent(b.name) }, 'Unduh'),
                    h('button', { class: 'btn small', onclick: ev => confirm('Pulihkan ' + b.name + '? Dunia saat ini dipindah ke folder _before-restore.') && run(() => api('POST', '/api/backups/restore', { name: b.name }), 'Dipulihkan. Silakan nyalakan server.', ev.currentTarget) }, 'Pulihkan'),
                    h('button', { class: 'btn small danger', onclick: ev => confirm('Hapus backup ini?') && run(async () => { await api('POST', '/api/backups/delete', { name: b.name }); await load(); }, 'Dihapus', ev.currentTarget) }, 'Hapus'))))
                    : h('p', {}, 'Belum ada backup.')));
              } catch (e) { toast(e.message, true); }
            };
            load();
          }

          // ─────────── Bedrock
          async function pageBedrock() {
            const box = h('div', { class: 'stack' });
            $('#view').replaceChildren(box);
            S.onStatus = () => {};
            const load = async () => {
              const [b, a, s] = await Promise.all([api('GET', '/api/bedrock'), api('GET', '/api/address'), api('GET', '/api/status')]);
              const ok = b.geyser && b.floodgate, can = s.software === 'paper' || s.software === 'purpur';
              const opt = a.options.find(o => o.bedrock_port);
              box.replaceChildren(head('Bedrock', 'Pemain HP, Xbox, PlayStation, dan Switch lewat Geyser'),
                card('Geyser dan Floodgate',
                  h('p', {}, 'Server Bedrock resmi hanya ada untuk x86, jadi tidak jalan langsung di HP. Geyser membuat pemain Bedrock bisa join ke server Java ini, Floodgate membuat mereka tidak perlu akun Java.'),
                  can ? null : note('bad', 'Geyser hanya untuk Paper dan Purpur. Ganti software di tab Versi.'),
                  kv('Geyser', b.geyser ? 'terpasang' : 'belum'), kv('Floodgate', b.floodgate ? 'terpasang' : 'belum'),
                  kv('Login Bedrock (auth-type)', b.auth || (b.config_exists ? '-' : 'config belum dibuat')),
                  h('div', { class: 'row', style: 'margin-top:10px' },
                    can && h('button', { class: 'btn primary', onclick: ev => run(async () => { const r = await api('POST', '/api/bedrock/install'); await load(); return r; }, r => 'Terpasang: ' + r.installed.join(', ') + '. Restart server.', ev.currentTarget) }, ok ? 'Perbarui Geyser dan Floodgate' : 'Pasang Geyser dan Floodgate'),
                    b.config_exists && b.auth !== 'floodgate' && h('button', { class: 'btn', onclick: ev => run(async () => { await api('POST', '/api/bedrock/auth'); await load(); }, 'Diubah ke floodgate. Restart server.', ev.currentTarget) }, 'Login tanpa akun Java'))),
                card('Cara join dari Bedrock', opt ? [joinLines(opt), h('p', { class: 'small' }, 'Di Minecraft Bedrock: Play, Servers, Add Server, isi alamat dan port. Port memakai UDP.')]
                  : h('p', {}, 'Alamat Bedrock muncul setelah Geyser terpasang dan ada domain, tunnel, atau Wi-Fi. Atur di tab Alamat.')));
            };
            try { await load(); } catch (e) { toast(e.message, true); }
          }

          // ─────────── Tunnel
          async function pageTunnel() {
            const box = h('div', { class: 'stack' });
            $('#view').replaceChildren(box);
            S.onStatus = () => {};
            const load = async () => {
              const t = await api('GET', '/api/tunnel');
              box.replaceChildren(head('Tunnel', 'Supaya teman di luar Wi-Fi bisa join tanpa buka port router'), card('playit.gg',
                h('p', {}, 'Perlu akun gratis di playit.gg. Fitur ini masih eksperimental di Termux.'),
                !t.installed && h('button', { class: 'btn primary', onclick: ev => run(async () => { await api('POST', '/api/tunnel/install'); await load(); }, 'Agent playit terpasang', ev.currentTarget) }, 'Pasang agent playit'),
                t.installed && h('div', { class: 'row' },
                  !t.running && h('button', { class: 'btn primary', onclick: ev => run(async () => { await api('POST', '/api/tunnel/start'); setTimeout(load, 2500); }, 'Tunnel dijalankan', ev.currentTarget) }, 'Jalankan tunnel'),
                  t.running && h('button', { class: 'btn', onclick: ev => run(async () => { await api('POST', '/api/tunnel/stop'); await load(); }, 'Tunnel dihentikan', ev.currentTarget) }, 'Hentikan tunnel'),
                  btnI('refresh', 'Segarkan', { class: 'btn small ghost', onclick: () => load() })),
                t.installed && !t.chroot && note('', 'termux-chroot tidak ada. Di Termux jalankan: pkg install proot resolv-conf'),
                t.claim && note('ok', 'Klaim agent: ', h('a', { href: t.claim, target: '_blank', rel: 'noopener' }, t.claim)),
                t.addresses.length ? h('div', {}, h('p', {}, 'Alamat tunnel yang terdeteksi:'), t.addresses.map(x => h('span', { class: 'tag', onclick: () => copy(x) }, x))) : null,
                t.output ? h('pre', { class: 'out' }, t.output) : null));
            };
            try { await load(); } catch (e) { toast(e.message, true); }
          }

          // ─────────── Pengaturan
          const PROPS = [
            ['motd', 'MOTD (teks di daftar server)', 'text'], ['max-players', 'Maksimal pemain', 'num'],
            ['difficulty', 'Kesulitan', ['peaceful', 'easy', 'normal', 'hard']], ['gamemode', 'Mode game', ['survival', 'creative', 'adventure', 'spectator']],
            ['online-mode', 'Wajib akun Java asli (online-mode)', 'bool'], ['white-list', 'Whitelist', 'bool'], ['pvp', 'PvP', 'bool'],
            ['allow-flight', 'Boleh terbang', 'bool'], ['hardcore', 'Hardcore', 'bool'], ['view-distance', 'Jarak pandang (chunk)', 'num'],
            ['simulation-distance', 'Jarak simulasi (chunk)', 'num'], ['server-port', 'Port Java', 'num'], ['spawn-protection', 'Proteksi spawn', 'num']];
          const DEFAULT_TRUE = ['online-mode', 'pvp'];

          async function pageSettings() {
            const box = h('div', { class: 'stack' });
            $('#view').replaceChildren(box);
            S.onStatus = () => {};
            const load = async () => {
              const [c, pr] = await Promise.all([api('GET', '/api/settings'), api('GET', '/api/props')]);
              const f = {};
              const field = (k, label, help, type) => {
                f[k] = h('input', { class: 'inp', type: type || 'text', value: c[k], autocapitalize: 'off', spellcheck: 'false' });
                return h('div', {}, h('label', { class: 'f' }, label), f[k], help ? h('p', { class: 'small' }, help) : null);
              };
              const auto = h('input', { type: 'checkbox', checked: !!c.auto_restart });
              const bind = h('select', { value: c.bind }, h('option', { value: '127.0.0.1' }, 'Hanya di HP ini (aman)'), h('option', { value: '0.0.0.0' }, 'Bisa dibuka dari Wi-Fi (pakai password kuat)'));
              const saveCfg = ev => run(() => api('POST', '/api/settings', {
                server_name: f.server_name.value, ram_mb: f.ram_mb.value, jvm_flags: f.jvm_flags.value, contact: f.contact.value, backup_every_h: f.backup_every_h.value,
                backup_keep: f.backup_keep.value, java: f.java.value, upload_max_mb: f.upload_max_mb.value, auto_restart: auto.checked, bind: bind.value
              }), 'Tersimpan. RAM dan JVM berlaku saat server dijalankan ulang.', ev.currentTarget);
              const pf = {};
              const propRows = PROPS.map(([k, label, kind]) => {
                const cur = pr.props[k] ?? '';
                let el, init;
                if (kind === 'bool') { init = cur === '' ? DEFAULT_TRUE.includes(k) : cur === 'true'; el = h('input', { type: 'checkbox', checked: init }); }
                else if (Array.isArray(kind)) { init = cur; el = h('select', { value: cur }, h('option', { value: '' }, '(bawaan)'), kind.map(o => h('option', { value: o }, o))); }
                else { init = cur; el = h('input', { class: 'inp', type: kind === 'num' ? 'number' : 'text', value: cur, placeholder: 'bawaan' }); }
                pf[k] = { el, kind, init };
                return kind === 'bool'
                  ? h('div', {}, h('label', { class: 'sw' }, el, label), k === 'online-mode' ? h('p', { class: 'small' }, 'Matikan hanya untuk pemain non-premium. Aktifkan whitelist supaya nama tidak dipakai orang lain.') : null)
                  : h('div', {}, h('label', { class: 'f' }, label), el);
              });
              const saveProps = ev => run(async () => {
                const changes = {};
                for (const [k, { el, kind, init }] of Object.entries(pf)) {
                  if (kind === 'bool') { if (el.checked !== init) changes[k] = String(el.checked); } else if (el.value !== init) changes[k] = el.value;
                }
                if (!Object.keys(changes).length) return toast('Tidak ada yang berubah');
                await api('POST', '/api/props', { changes });
                toast('Properti tersimpan. Restart server agar berlaku.');
              }, null, ev.currentTarget);
              const pw = h('input', { class: 'inp', type: 'password', placeholder: 'Password baru (minimal 6 karakter)', autocomplete: 'new-password' });
              box.replaceChildren(head('Pengaturan'),
                h('div', { class: 'grid2' },
                  card('Server', field('server_name', 'Nama server', 'Tampil di panel. Mau ikut ke MOTD? Ganti lewat ikon pensil di Ringkasan.'),
                    field('ram_mb', 'RAM untuk server (MB)', 'HP ini punya ' + (c.mem_total || '?') + ' MB. Pakai maksimal sekitar 60% supaya Android tidak mematikan Termux.', 'number'),
                    field('jvm_flags', 'Opsi JVM tambahan'), field('java', 'Lokasi Java (kosongkan untuk otomatis)'), field('contact', 'Kontak untuk unduhan Paper'),
                    h('label', { class: 'sw' }, auto, 'Jalankan ulang otomatis kalau server crash'),
                    field('backup_every_h', 'Backup otomatis tiap berapa jam (0 = mati)', null, 'number'), field('backup_keep', 'Simpan berapa backup otomatis', null, 'number'),
                    field('upload_max_mb', 'Batas ukuran unggahan (MB)', null, 'number'),
                    h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'btn primary', onclick: saveCfg }, 'Simpan pengaturan'))),
                  card('Properti server', propRows, h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'btn primary', onclick: saveProps }, 'Simpan properti')),
                    h('p', { class: 'small' }, 'Properti lain ada di tab File, server.properties.'))),
                h('div', { class: 'grid2' },
                  card('Minecraft EULA', c.eula ? h('p', {}, 'EULA sudah disetujui.') : h('div', {}, h('p', {}, 'Dengan lanjut, kamu setuju dengan ', h('a', { href: 'https://aka.ms/MinecraftEULA', target: '_blank', rel: 'noopener' }, 'Minecraft EULA'), '.'),
                    h('button', { class: 'btn', onclick: act(async () => { await api('POST', '/api/eula', { accept: true }); await load(); }, 'EULA disetujui') }, 'Saya setuju'))),
                  card('Akses panel', bind, h('p', { class: 'small' }, 'Mengubah ini perlu panel dimulai ulang. Simpan dulu, lalu mulai ulang.'),
                    h('div', { class: 'row' }, h('button', { class: 'btn', onclick: ev => run(async () => { await api('POST', '/api/panel/restart'); setTimeout(() => location.reload(), 3500); }, 'Panel dimulai ulang…', ev.currentTarget) }, 'Mulai ulang panel'))),
                  card('Password panel', pw, h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn', onclick: ev => run(async () => { await api('POST', '/api/settings/password', { password: pw.value }); toast('Password diganti. Silakan masuk lagi.'); setTimeout(() => location.reload(), 1200); }, null, ev.currentTarget) }, 'Ganti password')))));
            };
            try { await load(); } catch (e) { toast(e.message, true); }
          }

          window.addEventListener('hashchange', () => { if ($('#view')) go(); });
          start();
          __EOF_APP_JS__

          cat > app/assets/app.css <<'__EOF_APP_CSS__'
          :root{--bg:#050807;--side:#08100c;--card:#0d1511;--card2:#121c16;--line:#1d2c23;--txt:#e7f3ec;--mut:#86a091;--g:#3ddc6c;--g2:#1fa84a;--warn:#f2b632;--bad:#ff6b6b;--r:14px;color-scheme:dark}
          :root{--gd:#0f3a22}
          *{box-sizing:border-box}
          html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
          body{overflow:hidden}
          a{color:var(--g);text-decoration:none;cursor:pointer}
          h1,h2{margin:0;letter-spacing:-.01em}h1{font-size:20px}h2{font-size:15px;margin-bottom:8px}
          p{margin:0 0 8px;color:var(--mut)}code,.mono,pre,textarea.mono{font-family:ui-monospace,"JetBrains Mono","Roboto Mono",Menlo,monospace}
          .mut{color:var(--mut)}.small{font-size:12px}.grow{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:12px}
          .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row.sp{justify-content:space-between;flex-wrap:nowrap}.row.tight{gap:4px;flex-wrap:nowrap}
          .ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
