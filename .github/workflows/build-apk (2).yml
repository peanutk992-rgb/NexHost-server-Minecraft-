                h('button', { class: 'btn small ghost', onclick: () => copy(String(o.bedrock_port), 'Port Bedrock disalin') }, 'Salin port')));
            }
            return rows;
          }

          function renameModal(s) {
            const name = h('input', { class: 'inp', value: s.server_name || '', maxlength: 40, placeholder: 'Nama server' });
            const motd = h('input', { type: 'checkbox', checked: true });
            modal('Ganti nama server', h('div', { class: 'stack' },
              h('p', {}, 'Nama ini tampil di panel. Kalau dicentang, nama juga jadi MOTD, yaitu teks di daftar server Minecraft.'),
              name, h('label', { class: 'sw' }, motd, 'Pakai juga sebagai MOTD')),
            [{
              label: 'Simpan', cls: 'primary', fn: async close => {
                const r = await api('POST', '/api/server/rename', { name: name.value, motd: motd.checked });
                toast('Nama server sekarang: ' + r.name + (r.motd && s.state !== 'stopped' ? '. Restart server supaya MOTD baru tampil.' : ''));
                close();
                refreshStatus();
              }
            }]);
            setTimeout(() => name.focus(), 60);
          }

          function hero(s) {
            const on = s.state !== 'stopped', opt = S.addr && S.addr.primary;
            const bars = s.state === 'running' ? 5 : s.state === 'stopped' ? 0 : 2;
            const ver = s.server_installed ? (s.software_name + ' ' + (s.mc_version || '')).trim() : 'Belum ada server';
            return h('section', { class: 'hero ' + s.state },
              h('div', { class: 'hero-top' },
                blockIcon(64),
                h('div', { class: 'hero-txt' },
                  h('div', { class: 'row tight' }, h('h1', { class: 'sname' }, s.server_name || 'NexHost Server'),
                    iconBtn('edit', 'Ganti nama server', () => renameModal(s))),
                  h('div', { class: 'motd' }, s.motd ? mcText(s.motd) : h('span', { class: 'mut' }, 'Belum ada MOTD')),
                  h('div', { class: 'chips' },
                    h('span', { class: 'chip' }, ico('tag', 14), ver),
                    h('span', { class: 'chip', id: 'd-up' }, ico('clock', 14), h('span', {}, '')),
                    h('span', { class: 'chip' }, ico('world', 14), s.world || 'world'))),
                h('div', { class: 'hero-right', title: 'Pemain online' },
                  h('div', { class: 'pc' }, h('b', {}, s.players.length), '/' + s.max_players),
                  h('div', { class: 'bars' }, [1, 2, 3, 4, 5].map(i => h('i', { class: i <= bars ? 'on' : '' }))),
                  h('div', { class: 'lbl' }, LABEL[s.state]))),
              h('div', { class: 'hero-bot' },
                h('div', { class: 'joins' }, opt
                  ? [joinLines(opt), h('div', { class: 'hint' }, opt.scope === 'wifi'
                    ? 'Alamat ini hanya untuk perangkat di Wi-Fi yang sama. '
                    : '', h('a', { href: '#address' }, 'Atur alamat dan domain'))]
                  : [h('div', { class: 'hint' }, 'Belum ada alamat untuk teman join. ', h('a', { href: '#address' }, 'Atur domain atau cari IP'))]),
                h('div', { class: 'ctl' },
                  !on && btnI('play', 'Mulai', { class: 'btn primary big', onclick: act(() => api('POST', '/api/server/start'), 'Server dijalankan') }),
                  on && btnI('stop', 'Hentikan', { class: 'btn big', onclick: act(() => api('POST', '/api/server/stop'), 'Menghentikan server…') }),
                  on && btnI('restart', 'Restart', { class: 'btn', onclick: act(() => api('POST', '/api/server/restart'), 'Memulai ulang…') }),
                  on && btnI('bolt', 'Paksa', {
                    class: 'btn danger', title: 'Paksa berhenti', onclick: ev => confirm('Paksa berhenti? Dunia yang belum tersimpan bisa hilang.')
                      && run(() => api('POST', '/api/server/kill'), 'Dipaksa berhenti', ev.currentTarget)
                  }))));
          }

          function setupCard(s) {
            const contact = h('input', { class: 'inp', placeholder: 'Email atau URL kontakmu', autocapitalize: 'off' });
            const sw = h('select', {}, [['paper', 'Paper (plugin, paling umum)'], ['purpur', 'Purpur (plugin, banyak opsi)'],
              ['vanilla', 'Vanilla (resmi Mojang)'], ['fabric', 'Fabric (mod)']].map(([v, l]) => h('option', { value: v }, l)));
            const step = (done, title, ...body) => h('div', { class: 'step' + (done ? ' done' : '') },
              h('span', { class: 'sn' }, done ? ico('check', 16) : ''), h('div', { class: 'sb' }, h('b', {}, title), done ? null : body));
            return card('Persiapan awal',
              step(s.contact_set, 'Kontak untuk unduhan Paper',
                h('p', { class: 'small' }, 'PaperMC mewajibkan kontak di setiap unduhan. Hanya dikirim ke PaperMC.'),
                h('div', { class: 'row' }, h('div', { class: 'grow' }, contact),
                  h('button', { class: 'btn', onclick: act(() => api('POST', '/api/settings', { contact: contact.value }), 'Kontak tersimpan') }, 'Simpan'))),
              step(s.server_installed, 'Pasang software server',
                h('div', { class: 'row' }, h('div', { class: 'grow' }, sw),
                  h('button', {
                    class: 'btn primary', onclick: act(async () => {
                      const r = await api('POST', '/api/server/install', { software: sw.value });
                      if (!r.java_ok) toast('Java ' + r.java + ' belum terpasang. Di Termux jalankan: pkg install openjdk-' + r.java, true);
                      return r;
                    }, r => r.software + ' ' + r.version + ' terpasang')
                  }, 'Pasang versi terbaru')),
                h('p', { class: 'small' }, 'Mau versi tertentu? Buka ', h('a', { href: '#versions' }, 'tab Versi'), '.')),
              step(s.eula, 'Setujui Minecraft EULA',
                h('p', { class: 'small' }, 'Dengan lanjut, kamu setuju dengan ', h('a', { href: 'https://aka.ms/MinecraftEULA', target: '_blank', rel: 'noopener' }, 'Minecraft EULA'), '.'),
                h('button', { class: 'btn', onclick: act(() => api('POST', '/api/eula', { accept: true }), 'EULA disetujui') }, 'Saya setuju')));
          }

          const tile = (icon, label, value, sub, extra) => h('div', { class: 'tile' },
            h('div', { class: 'tl' }, ico(icon, 15), label), h('div', { class: 'tv' }, value), sub ? h('div', { class: 'ts' }, sub) : null, extra || null);

          function dashStruct(s) {
            const out = [hero(s)];
            if (s.crash_log) out.push(note('bad', h('b', {}, 'Server berhenti dengan error. '), 'Output terakhir:', h('pre', { class: 'out' }, s.crash_log)));
            if (!s.server_installed || !s.eula || !s.contact_set) out.push(setupCard(s));
            out.push(h('div', { class: 'tiles', id: 'd-res' }));
            if (s.players.length) out.push(card('Pemain online', h('div', {}, s.players.map(p => h('span', { class: 'tag' }, p)))));
            return out;
          }

          function dashLive(s) {
            const up = $('#d-up');
            if (up) up.lastChild.textContent = s.state === 'stopped' ? 'mati' : fmtDur(s.uptime);
            const res = $('#d-res');
            if (!res) return;
            const pct = s.rss_mb != null && s.ram_mb ? Math.min(100, s.rss_mb / s.ram_mb * 100) : 0;
            res.replaceChildren(
              tile('ram', 'RAM server', s.rss_mb != null ? s.rss_mb + ' MB' : 'mati', s.rss_mb != null ? 'dari ' + s.ram_mb + ' MB' : 'jatah ' + s.ram_mb + ' MB', meter(pct)),
              tile('bolt', 'CPU server', s.cpu != null ? s.cpu + '%' : '-', s.cpu != null ? 'pemakaian sekarang' : 'server mati'),
              tile('ram', 'RAM HP kosong', s.mem_avail != null ? s.mem_avail + ' MB' : '-', s.mem_total ? 'dari ' + s.mem_total + ' MB' : ''),
              tile('files', 'Penyimpanan', fmtB(s.disk_free_mb * 1048576), 'ruang kosong'));
          }

          function pageDash() {
            const box = h('div', { class: 'stack' });
            $('#view').replaceChildren(box);
            let key = '';
            const draw = s => {
              const k = JSON.stringify([s.state, s.players, s.max_players, s.server_name, s.motd, s.software, s.mc_version, s.build, s.world,
                s.server_installed, s.eula, s.contact_set, s.crashed, s.crash_log, S.addr && S.addr.primary]);
              if (k !== key) { key = k; box.replaceChildren(...dashStruct(s)); }
              dashLive(s);
            };
            S.onStatus = draw;
            const loadAddr = async () => { try { S.addr = await api('GET', '/api/address'); if (S.st) draw(S.st); } catch (e) { /* diam */ } };
            loadAddr();
            every(20000, loadAddr);
            if (S.st) draw(S.st);
          }

          // ─────────── Konsol
          function pageConsole() {
            const log = h('pre', { class: 'log' });
            const inp = h('input', { class: 'inp mono', placeholder: 'Ketik perintah, mis. list', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', enterkeyhint: 'send' });
            let since = 0, busy = false;
            const add = (t, cls) => {
              const near = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
              const c = cls || (/ERROR|Exception|FATAL/.test(t) ? 'e' : /WARN/.test(t) ? 'w' : /^\[panel\]|Done \(/.test(t) ? 'n' : '');
              log.append(h('div', { class: c }, t));
              while (log.childElementCount > 1500) log.firstChild.remove();
              if (near) log.scrollTop = log.scrollHeight;
            };
            const poll = async () => {
              if (busy) return;
              busy = true;
              try { const r = await api('GET', '/api/console?since=' + since); r.lines.forEach(([, t]) => add(t)); since = r.next; } catch (e) { /* diam */ }
              busy = false;
            };
            const send = async () => {
              const v = inp.value.trim();
              if (!v) return;
              inp.value = '';
              add('> ' + v, 'echo');
              try { await api('POST', '/api/server/command', { cmd: v }); } catch (e) { toast(e.message, true); }
            };
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
            const quick = ['list', 'save-all', 'tps', 'say Halo semua!'].map(c => h('button', { class: 'btn small', onclick: () => { inp.value = c; send(); } }, c));
            $('#view').replaceChildren(h('div', { class: 'stack consolebox' }, head('Konsol', 'Log server langsung dan kirim perintah'),
              h('div', { class: 'card grow' }, log, h('div', { class: 'row', style: 'margin-top:10px' }, h('div', { class: 'grow' }, inp),
                h('button', { class: 'btn primary', onclick: send }, 'Kirim')), h('div', { class: 'row', style: 'margin-top:8px' }, quick))));
            poll();
            every(1000, poll);
          }

