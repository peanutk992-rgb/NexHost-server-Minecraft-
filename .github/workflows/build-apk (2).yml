          def mr_loaders():
              need_content_dir()
              return ["fabric"] if software_id() == "fabric" else ["paper", "spigot", "bukkit", "purpur"]


          def mr_search(q, compat):
              need_content_dir()
              if software_id() == "fabric":
                  facets = [["project_type:mod"], ["categories:fabric"]]
              else:
                  facets = [["categories:paper", "categories:spigot", "categories:bukkit", "categories:purpur", "categories:folia"]]
              ver = mc_version()
              if compat and ver:
                  facets.append([f"versions:{ver}"])
              url = f"{MR_API}/search?" + urllib.parse.urlencode(
                  {"query": q, "limit": 20, "index": "relevance" if q else "downloads", "facets": json.dumps(facets)})
              return [{"id": h["project_id"], "title": h["title"], "desc": h.get("description", ""), "downloads": h.get("downloads", 0),
                       "icon": h.get("icon_url") or "", "author": h.get("author", "")} for h in get_json(url, GENERIC_UA)["hits"]]


          def mr_install(project, depth=0, seen=None):
              seen = seen if seen is not None else set()
              if project in seen:
                  return []
              seen.add(project)
              ver = mc_version()
              prm = {"loaders": json.dumps(mr_loaders())}
              if ver:
                  prm["game_versions"] = json.dumps([ver])
              vs = get_json(f"{MR_API}/project/{urllib.parse.quote(project)}/version?" + urllib.parse.urlencode(prm), GENERIC_UA)
              if not vs:
                  raise ApiError(404, f"Plugin ini belum punya versi untuk Minecraft {ver or '?'}")
              v = next((x for x in vs if x.get("version_type") == "release"), vs[0])
              f = next((x for x in v["files"] if x.get("primary")), v["files"][0])
              fname = os.path.basename(f["filename"])
              host = urllib.parse.urlparse(f["url"]).hostname
              if not fname.endswith(".jar") or not re.fullmatch(r"[A-Za-z0-9_.\-+() ]{1,120}", fname):
                  raise ApiError(400, f"Nama file dari Modrinth tidak aman: {fname}")
              if host != "cdn.modrinth.com" and not os.environ.get("MC_ALLOW_ANY_DL"):
                  raise ApiError(400, f"Host unduhan tidak dikenal: {host}")
              download(f["url"], SERVER / need_content_dir() / fname, GENERIC_UA, sha512=(f.get("hashes") or {}).get("sha512"))
              done = [fname]
              for dep in v.get("dependencies", []):
                  if dep.get("dependency_type") == "required" and dep.get("project_id") and depth < 2:
                      try:
                          done += mr_install(dep["project_id"], depth + 1, seen)
                      except Exception:
                          pass
              return done


          def geyser_cfg():
              return SERVER / "plugins" / "Geyser-Spigot" / "config.yml"


          def geyser_port():
              m = re.search(r"(?ms)^bedrock:.*?^\s+port:\s*(\d+)", read_text(geyser_cfg()))
