          elif [ "$EULA" = yes ]; then
            echo " Server    : GAGAL dinyalakan. Coba ketik: mc start"
          else
            echo " Server    : belum jalan karena EULA belum disetujui. Setujui di panel, menu Pengaturan."
          fi
          echo " Bedrock   : alamat IP HP, port 19132 (UDP), lewat Geyser."
          echo " Penting   : matikan penghemat baterai untuk Termux agar server tidak dimatikan Android."
          echo " Bantuan   : ketik: mc help"
          __EOF_I_SH__

          cat > app/assets/panel.py <<'__EOF_PANEL_PY__'
          #!/usr/bin/env python3
          """NexHost: panel server Minecraft untuk Termux (Paper, Purpur, Vanilla, Fabric + Geyser/Floodgate). Hanya pakai library bawaan Python."""
          import os, sys, re, json, time, shlex, shutil, socket, hashlib, hmac, secrets, tarfile, zipfile, platform
          import threading, subprocess, traceback, urllib.request, urllib.parse, urllib.error
          from collections import deque
          from contextlib import contextmanager
          from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
          from pathlib import Path

          VERSION = "2.0"
          HOME = Path(os.environ.get("MC_HOME") or (Path.home() / "minecraft")).resolve()
          SERVER, PANEL, BACKUPS, TUNNEL = HOME / "server", HOME / "panel", HOME / "backups", HOME / "tunnel"
          STATIC, CFG_FILE, STATE_FILE = PANEL / "static", PANEL / "config.json", PANEL / "state.json"
          S_SRV, S_TUN = "mc-server", "mc-tunnel"
          PAPER_API = os.environ.get("MC_PAPER_API", "https://fill.papermc.io/v3/projects/paper")
          MR_API = os.environ.get("MC_MODRINTH_API", "https://api.modrinth.com/v2")
          GEYSER_API = os.environ.get("MC_GEYSER_API", "https://download.geysermc.org/v2/projects")
          PLAYIT_URL = os.environ.get("MC_PLAYIT_URL", "https://github.com/playit-cloud/playit-agent/releases/latest/download")
          MOJANG_API = os.environ.get("MC_MOJANG_API", "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json")
          PURPUR_API = os.environ.get("MC_PURPUR_API", "https://api.purpurmc.org/v2/purpur")
          FABRIC_API = os.environ.get("MC_FABRIC_API", "https://meta.fabricmc.net/v2/versions")
          DOH_URL = os.environ.get("MC_DOH_URL", "https://dns.google/resolve")
          IP_API = os.environ.get("MC_IP_API", "https://api.ipify.org")
          GENERIC_UA = "NexHost/" + VERSION


          class ApiError(Exception):
              def __init__(self, code, msg):
                  super().__init__(msg)
                  self.code, self.msg = code, msg


          # ───────────────────────── konfigurasi ─────────────────────────
          DEFAULTS = {"port": 8080, "bind": "127.0.0.1", "ram_mb": 0, "jvm_flags": "-XX:+DisableExplicitGC -Dfile.encoding=UTF-8",
                      "java": "", "contact": "", "auto_restart": True, "backup_every_h": 0, "backup_keep": 5,
                      "upload_max_mb": 512, "pw_hash": "", "pw_salt": "", "server_name": "NexHost Server", "public_host": "",
                      "public_java_port": 0, "public_bedrock_port": 0}
          SETTABLE = {"ram_mb": int, "jvm_flags": str, "contact": str, "auto_restart": bool, "backup_every_h": int,
                      "backup_keep": int, "bind": str, "java": str, "port": int, "upload_max_mb": int, "server_name": str,
                      "public_host": str, "public_java_port": int, "public_bedrock_port": int}


          def read_text(p, default=""):
              try:
                  return Path(p).read_text("utf-8", "replace")
              except Exception:
                  return default


          def to_int(x, d):
              try:
                  return int(str(x).strip())
              except Exception:
                  return d


          def meminfo():
              d = {}
              try:
                  for l in open("/proc/meminfo"):
                      k, v = l.split(":", 1)
                      d[k] = int(v.split()[0]) // 1024
              except Exception:
                  pass
              return d


          def load_cfg():
              try:
                  d = json.loads(CFG_FILE.read_text())
              except Exception:
                  d = {}
              c = {**DEFAULTS, **d}
              if not c["ram_mb"]:
                  tot = meminfo().get("MemTotal", 4096)
                  c["ram_mb"] = max(768, min(int(tot * 0.45) // 256 * 256, 4096))
              return c


          def save_cfg(c):
              PANEL.mkdir(parents=True, exist_ok=True)
              tmp = CFG_FILE.with_suffix(".tmp")
              tmp.write_text(json.dumps(c, indent=2))
              os.chmod(tmp, 0o600)
              os.replace(tmp, CFG_FILE)


          HOST_LABEL = re.compile(r"^(?!-)[a-z0-9-]{1,63}(?<!-)$")
          LOOPBACK = ("localhost", "0.0.0.0", "::", "::1")


          def clean_host(v):
              """Domain atau IP yang dipakai teman untuk join. Alamat localhost sengaja ditolak."""
              v = str(v or "").strip().lower().rstrip(".")
              if not v:
                  return ""
              if v in LOOPBACK or re.fullmatch(r"127\.\d+\.\d+\.\d+", v):
                  raise ApiError(400, "Alamat localhost hanya bisa dipakai di HP ini. Isi domain atau IP yang bisa dijangkau temanmu, contoh: servermc.play.id")
              if len(v) > 253 or re.search(r"[\s/\\@?#]", v):
                  raise ApiError(400, "Isi hanya domain atau IP, tanpa http://, garis miring, atau spasi. Contoh: servermc.play.id")
              if ":" in v:  # hanya IPv6 yang boleh memuat ':'
                  try:
                      socket.inet_pton(socket.AF_INET6, v)
                  except OSError:
                      raise ApiError(400, "Port diisi di kolom port sendiri. Kolom alamat hanya untuk domain atau IP.")
              elif re.fullmatch(r"[0-9.]+", v):
                  try:
                      socket.inet_pton(socket.AF_INET, v)
                  except OSError:
                      raise ApiError(400, "Alamat IP tidak valid")
              elif len(v.split(".")) < 2 or not all(HOST_LABEL.match(x) for x in v.split(".")):
                  raise ApiError(400, "Domain tidak valid. Contoh: servermc.play.id")
              return v


          def apply_settings(d):
              c = load_cfg()
              for k, v in d.items():
                  if k not in SETTABLE:
                      continue
                  t = SETTABLE[k]
                  if t is bool:
                      v = v if isinstance(v, bool) else str(v).lower() in ("1", "true", "yes", "on")
                  elif t is int:
                      v = to_int(v, None)
                      if v is None:
                          raise ApiError(400, f"'{k}' harus berupa angka")
                  else:
                      v = str(v).strip()
                  if k == "server_name":
                      v = " ".join(v.split())
                      if not 1 <= len(v) <= 40 or re.search(r"[\x00-\x1f\x7f]", v):
                          raise ApiError(400, "Nama server harus 1 sampai 40 karakter")
                  if k == "public_host":
                      v = clean_host(v)
                  if k in ("public_java_port", "public_bedrock_port") and not (v == 0 or 1 <= v <= 65535):
                      raise ApiError(400, "Port harus 1-65535, atau 0 untuk otomatis")
                  if k == "ram_mb" and not 256 <= v <= 65536:
                      raise ApiError(400, "RAM harus antara 256 dan 65536 MB")
                  if k == "bind" and v not in ("127.0.0.1", "0.0.0.0"):
                      raise ApiError(400, "bind harus 127.0.0.1 atau 0.0.0.0")
                  if k == "port" and not 1024 <= v <= 65535:
                      raise ApiError(400, "Port panel harus 1024-65535")
                  if k in ("backup_every_h", "backup_keep", "upload_max_mb") and v < 0:
                      raise ApiError(400, f"'{k}' tidak boleh negatif")
                  if k == "jvm_flags":
                      try:
                          shlex.split(v)
                      except ValueError:
                          raise ApiError(400, "JVM flags tidak valid (tanda kutip tidak berpasangan)")
                  c[k] = v
              save_cfg(c)
              return c


          def hash_pw(pw, salt):
              return hashlib.pbkdf2_hmac("sha256", pw.encode(), bytes.fromhex(salt), 200_000).hex()


          def set_password(pw):
              c = load_cfg()
              c["pw_salt"] = secrets.token_hex(16)
              c["pw_hash"] = hash_pw(pw, c["pw_salt"])
              save_cfg(c)


          def check_password(pw):
              c = load_cfg()
              return bool(c["pw_hash"]) and hmac.compare_digest(hash_pw(pw, c["pw_salt"]), c["pw_hash"])


          def get_desired():
              try:
                  return bool(json.loads(STATE_FILE.read_text()).get("desired"))
              except Exception:
                  return False


          def set_desired(v):
              PANEL.mkdir(parents=True, exist_ok=True)
              STATE_FILE.write_text(json.dumps({"desired": bool(v)}))


          # ───────────────────────── unduhan ─────────────────────────
          def http_open(url, ua, timeout=30):
              return urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua, "Accept": "application/json, */*"}), timeout=timeout)


          def get_json(url, ua):
              with http_open(url, ua) as r:
                  return json.load(r)


          def download(url, dest, ua, sha256=None, sha512=None, sha1=None, md5=None):
              dest = Path(dest)
              dest.parent.mkdir(parents=True, exist_ok=True)
              tmp = dest.with_name(dest.name + ".part")
              a, b, c1, c5 = hashlib.sha256(), hashlib.sha512(), hashlib.sha1(), hashlib.md5()
              try:
                  with http_open(url, ua, 90) as r, open(tmp, "wb") as f:
                      while True:
                          ch = r.read(1 << 16)
                          if not ch:
                              break
                          f.write(ch)
                          a.update(ch)
                          b.update(ch)
                          c1.update(ch)
                          c5.update(ch)
                  if sha256 and a.hexdigest().lower() != sha256.lower():
                      raise ApiError(502, "Checksum SHA-256 tidak cocok, unduhan dibatalkan")
                  if sha512 and b.hexdigest().lower() != sha512.lower():
                      raise ApiError(502, "Checksum SHA-512 tidak cocok, unduhan dibatalkan")
                  if sha1 and c1.hexdigest().lower() != sha1.lower():
                      raise ApiError(502, "Checksum SHA-1 tidak cocok, unduhan dibatalkan")
                  if md5 and c5.hexdigest().lower() != md5.lower():
                      raise ApiError(502, "Checksum MD5 tidak cocok, unduhan dibatalkan")
                  if tmp.stat().st_size < 100:
                      raise ApiError(502, "Hasil unduhan terlalu kecil, kemungkinan salah")
                  os.replace(tmp, dest)
              finally:
                  tmp.unlink(missing_ok=True)


          # ───────────────────────── Paper & Java ─────────────────────────
          def vkey(v):
              return tuple(int(x) for x in v.split("."))


          def is_rel(v):
              return bool(re.fullmatch(r"\d+(\.\d+)+", v))


          def paper_ua():
              c = load_cfg()["contact"].strip()
              if not c:
                  raise ApiError(400, "Isi 'Kontak' (email atau URL) di Pengaturan dulu. PaperMC mewajibkannya untuk unduhan.")
              return f"{GENERIC_UA} ({c})"


          def paper_versions():
              d = get_json(PAPER_API, paper_ua())
              vs = {v for grp in d["versions"].values() for v in grp if is_rel(v)}
              return sorted(vs, key=vkey, reverse=True)


          def paper_build(ver):
              for b in get_json(f"{PAPER_API}/versions/{ver}/builds", paper_ua()):
                  if b.get("channel") in ("STABLE", "RECOMMENDED"):
                      return b["id"], b["downloads"]["server:default"]
              return None


          def java_major(v):
              if not is_rel(v):
                  return 21
              t = vkey(v)
              return 25 if t[0] >= 26 else 21 if t >= (1, 20, 5) else 17


          def install_paper(ver=None):
              ua, found = paper_ua(), None
              if ver:
                  if not is_rel(ver):
                      raise ApiError(400, "Versi tidak valid")
                  found = paper_build(ver)
                  if not found:
                      raise ApiError(404, f"Paper {ver} belum punya build stabil")
              else:
                  for v in paper_versions():
                      found = paper_build(v)
                      if found:
                          ver = v
                          break
                  if not found:
                      raise ApiError(502, "Tidak ada build Paper stabil yang ketemu")
              bid, dl = found
              SERVER.mkdir(parents=True, exist_ok=True)
              dest = SERVER / SOFTWARE["paper"]["jar"]
              _backup_jar(dest)
              download(dl["url"], dest, ua, sha256=(dl.get("checksums") or {}).get("sha256"))
              _record("paper", ver, bid, java_major(ver))
              return {"version": ver, "build": bid, "java": java_major(ver)}


          # ───────────────────────── software server: Paper, Purpur, Vanilla, Fabric ─────────────────────────
          SOFTWARE = {
              "paper": {"name": "Paper", "jar": "paper.jar", "dir": "plugins", "kind": "plugin"},
              "purpur": {"name": "Purpur", "jar": "purpur.jar", "dir": "plugins", "kind": "plugin"},
              "vanilla": {"name": "Vanilla", "jar": "vanilla.jar", "dir": None, "kind": None},
              "fabric": {"name": "Fabric", "jar": "fabric.jar", "dir": "mods", "kind": "mod"},
          }
          VER_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._\-]{0,39}$")


          def software_id():
              s = read_text(SERVER / ".software").strip()
              if s in SOFTWARE:
                  return s
              return "paper" if (SERVER / "paper.jar").exists() else ""


          def jar_file():
              sid = software_id()
              return SERVER / SOFTWARE[sid]["jar"] if sid else None


          def server_installed():
              j = jar_file()
              return bool(j and j.exists())


          def content_dir():
              """Folder plugin/mod untuk software yang aktif. None kalau software tidak mendukungnya (Vanilla)."""
              sid = software_id() or "paper"
              return SOFTWARE[sid]["dir"]


          def _backup_jar(dest):
              if dest.exists():
                  shutil.copy2(dest, dest.with_name(dest.name + ".bak"))


          def _record(sw, ver, build, java):
              SERVER.mkdir(parents=True, exist_ok=True)
              (SERVER / ".software").write_text(sw)
              (SERVER / ".mcversion").write_text(ver)
              (SERVER / ".build").write_text(str(build))
              (SERVER / ".java").write_text(str(java))
              if sw == "paper":
                  (SERVER / ".paperbuild").write_text(str(build))


          def java_note(ver):
              if is_rel(ver or "") and vkey(ver) < (1, 17):
                  return ("Versi ini aslinya memakai Java 8. Di Termux yang tersedia Java 17, jadi server atau plugin lama "
                          "bisa kurang stabil. Kalau ada masalah, coba versi 1.17 ke atas.")
              return ""


          def list_versions(sw, snapshots=False):
              if sw == "paper":
                  return [{"id": v, "type": "release"} for v in paper_versions()]
              if sw == "vanilla":
                  out = []
                  for x in get_json(MOJANG_API, GENERIC_UA).get("versions", []):
                      if x.get("type") == "release":
                          if is_rel(x["id"]) and vkey(x["id"]) < (1, 2, 5):
                              continue  # sebelum 1.2.5 tidak ada file server resmi
                          out.append({"id": x["id"], "type": "release"})
                      elif x.get("type") == "snapshot" and snapshots:
                          out.append({"id": x["id"], "type": "snapshot"})
                  return out
              if sw == "purpur":
                  vs = [v for v in get_json(PURPUR_API, GENERIC_UA).get("versions", []) if is_rel(v)]
                  return [{"id": v, "type": "release"} for v in sorted(vs, key=vkey, reverse=True)]
              if sw == "fabric":
                  return [{"id": x["version"], "type": "release" if x.get("stable") else "snapshot"}
                          for x in get_json(FABRIC_API + "/game", GENERIC_UA) if x.get("stable") or snapshots]
              raise ApiError(400, "Software server tidak dikenal")


          def install_vanilla(ver=None):
              m = get_json(MOJANG_API, GENERIC_UA)
              ver = ver or (m.get("latest") or {}).get("release")
              ent = next((x for x in m.get("versions", []) if x.get("id") == ver), None)
              if not ent:
                  raise ApiError(404, f"Versi {ver} tidak ada di daftar Mojang")
              meta = get_json(ent["url"], GENERIC_UA)
              srv = (meta.get("downloads") or {}).get("server")
              if not srv:
                  raise ApiError(404, f"Minecraft {ver} tidak punya file server resmi")
              host = urllib.parse.urlparse(srv["url"]).hostname or ""
              if not (host.endswith(".mojang.com") or host.endswith(".minecraft.net")) and not os.environ.get("MC_ALLOW_ANY_DL"):
                  raise ApiError(400, f"Host unduhan tidak dikenal: {host}")
              jar = SERVER / SOFTWARE["vanilla"]["jar"]
              _backup_jar(jar)
              download(srv["url"], jar, GENERIC_UA, sha1=srv.get("sha1"))
              need = to_int((meta.get("javaVersion") or {}).get("majorVersion"), 0)
              java = need if need >= 17 else (java_major(ver) if is_rel(ver) else 17)  # Termux tidak punya Java 8
              _record("vanilla", ver, "resmi Mojang", java)
              return {"version": ver, "build": "resmi Mojang", "java": java}


          def install_purpur(ver=None):
              vs = [x["id"] for x in list_versions("purpur")]
              ver = ver or (vs[0] if vs else None)
              if not ver or ver not in vs:
                  raise ApiError(404, f"Purpur belum punya versi {ver}")
              q = urllib.parse.quote(ver)
              build = str(((get_json(f"{PURPUR_API}/{q}", GENERIC_UA).get("builds")) or {}).get("latest") or "")
              if not re.fullmatch(r"\d{1,6}", build):
                  raise ApiError(404, f"Purpur {ver} belum punya build")
              meta = get_json(f"{PURPUR_API}/{q}/{build}", GENERIC_UA)
              if meta.get("result") not in (None, "SUCCESS"):
                  raise ApiError(502, f"Build Purpur {build} untuk {ver} gagal dibuat oleh PurpurMC")
              jar = SERVER / SOFTWARE["purpur"]["jar"]
              _backup_jar(jar)
              download(f"{PURPUR_API}/{q}/{build}/download", jar, GENERIC_UA, md5=meta.get("md5"))
              _record("purpur", ver, build, java_major(ver))
              return {"version": ver, "build": build, "java": java_major(ver)}


          def install_fabric(ver=None):
              games = get_json(FABRIC_API + "/game", GENERIC_UA)
              known = {x["version"] for x in games}
              ver = ver or next((x["version"] for x in games if x.get("stable")), None)
              if not ver or ver not in known:
                  raise ApiError(404, f"Fabric belum mendukung Minecraft {ver}")

              def newest(kind):
                  arr = get_json(f"{FABRIC_API}/{kind}", GENERIC_UA)
                  return next((x["version"] for x in arr if x.get("stable")), arr[0]["version"] if arr else None)
              loader, inst = newest("loader"), newest("installer")
              if not loader or not inst:
                  raise ApiError(502, "Daftar loader Fabric kosong")
              url = "{}/loader/{}/{}/{}/server/jar".format(FABRIC_API, *(urllib.parse.quote(x) for x in (ver, loader, inst)))
              jar = SERVER / SOFTWARE["fabric"]["jar"]
              _backup_jar(jar)
              download(url, jar, GENERIC_UA)
              _record("fabric", ver, "loader " + loader, java_major(ver) if is_rel(ver) else 21)
              return {"version": ver, "build": "loader " + loader, "java": java_major(ver) if is_rel(ver) else 21}


          def install_server(sw, ver=None):
              if sw not in SOFTWARE:
                  raise ApiError(400, "Software server tidak dikenal")
              ver = (ver or "").strip() or None
              if ver and not VER_RE.match(ver):
                  raise ApiError(400, "Versi tidak valid")
              if sw == "paper" and ver and not is_rel(ver):
                  raise ApiError(400, "Versi tidak valid")
              SERVER.mkdir(parents=True, exist_ok=True)
              r = {"paper": install_paper, "vanilla": install_vanilla, "purpur": install_purpur, "fabric": install_fabric}[sw](ver)
              r["software"], r["note"] = sw, java_note(r["version"])
              return r


          def java_bin(major=None):
              c = load_cfg()
              if c["java"]:
                  return c["java"]
              pre = os.environ.get("PREFIX", "")
              if major and pre:
                  p = Path(pre) / f"lib/jvm/java-{major}-openjdk/bin/java"
                  if p.exists():
                      return str(p)
              return shutil.which("java") or "java"


          def eula_ok():
              return bool(re.search(r"(?mi)^\s*eula\s*=\s*true", read_text(SERVER / "eula.txt")))


          # ───────────────────────── tmux & status server ─────────────────────────
          def tmux(*a):
              try:
                  return subprocess.run(["tmux", *a], capture_output=True, text=True, timeout=20)
              except FileNotFoundError:
                  raise ApiError(500, "tmux belum terpasang. Jalankan: pkg install tmux")


          def pane_info(sess):
              r = tmux("list-panes", "-t", f"={sess}:", "-F", "#{pane_pid}|#{pane_dead}|#{session_created}|#{pane_dead_status}")
              if r.returncode or not r.stdout.strip():
                  return None
              a = r.stdout.strip().splitlines()[0].split("|")
              return {"pid": int(a[0]), "dead": a[1] == "1", "since": int(a[2]), "code": a[3] if len(a) > 3 else ""}


          RE_JOIN = re.compile(r"\]: ([A-Za-z0-9_.\-]{1,40}) joined the game")
          RE_LEFT = re.compile(r"\]: ([A-Za-z0-9_.\-]{1,40}) left the game")
          RE_DONE = re.compile(r"\]: Done \([\d.,]+s\)!")
          RE_STOP = re.compile(r"\]: Stopping (?:the )?server")


          class LogTailer(threading.Thread):
              """Membaca logs/latest.log terus-menerus: konsol, daftar pemain, status 'sudah siap'."""
              def __init__(self):
                  super().__init__(daemon=True)
                  self.lock = threading.Lock()
                  self.buf, self.next_id = deque(maxlen=3000), 1
                  self.online, self.done, self.stopping = set(), False, False
                  self.ino, self.off, self.partial, self.first = None, 0, b"", True

              def note(self, text):
                  self._add(text)

              def _add(self, line):
                  with self.lock:
                      self.buf.append((self.next_id, line))
                      self.next_id += 1

              def feed(self, line):
                  self._add(line)
                  with self.lock:
                      m = RE_JOIN.search(line)
                      if m:
                          self.online.add(m.group(1))
                      m = RE_LEFT.search(line)
                      if m:
                          self.online.discard(m.group(1))
                      if RE_DONE.search(line):
                          self.done = True
                      if RE_STOP.search(line):
                          self.stopping = True

              def flags(self):
                  with self.lock:
                      return {"done": self.done, "stopping": self.stopping}

              def players(self):
                  with self.lock:
                      return sorted(self.online)

              def since(self, n):
                  with self.lock:
                      items = [(i, l) for i, l in self.buf if i > n] if n else list(self.buf)[-300:]
                      return items, self.next_id - 1

              def last_id(self):
                  with self.lock:
                      return self.next_id - 1

              def wait_for(self, text, after, timeout):
                  end = time.time() + timeout
                  while time.time() < end:
                      with self.lock:
                          if any(i > after and text in l for i, l in self.buf):
                              return True
                      time.sleep(0.3)
                  return False

              def poll_once(self):
                  """Satu putaran baca log. Mengembalikan True kalau masih ada data yang belum terbaca."""
                  path = SERVER / "logs" / "latest.log"
                  more = False
                  try:
                      st = os.stat(path)
                      if self.ino != st.st_ino or st.st_size < self.off:
                          self.ino, self.off, self.partial = st.st_ino, 0, b""
                          with self.lock:
                              self.online, self.done, self.stopping = set(), False, False
                          if not self.first:
                              self._add("─── log baru (server dimulai ulang) ───")
                          if st.st_size > 2_000_000:  # log besar: lompat ke ekor, anggap server sudah siap
                              self.off = st.st_size - 400_000
                              self.partial = b"\x00"
                              self.done = True
                          self.first = False
                      if st.st_size > self.off:
                          with open(path, "rb") as f:
                              f.seek(self.off)
                              data = f.read(1 << 20)
                          self.off += len(data)
                          parts = (self.partial + data).split(b"\n")
                          self.partial = parts.pop()
                          for raw in parts:
                              if raw.startswith(b"\x00"):
                                  continue
                              self.feed(raw.decode("utf-8", "replace").rstrip("\r"))
                          more = st.st_size > self.off
                  except FileNotFoundError:
                      pass
                  except Exception:
                      traceback.print_exc()
                  return more

              def run(self):
                  while True:
                      if not self.poll_once():
                          time.sleep(0.7)


          TAILER = LogTailer()


          def server_state():
              pi = pane_info(S_SRV)
              if not pi or pi["dead"]:
                  return {"state": "stopped", "pid": None, "crashed": bool(pi), "code": pi["code"] if pi else ""}
              f = TAILER.flags()
              st = "stopping" if f["stopping"] else "running" if f["done"] else "starting"
              return {"state": st, "pid": pi["pid"], "since": pi["since"]}


          def server_cmd():
              c = load_cfg()
              ver = read_text(SERVER / ".mcversion").strip()
              ram = int(c["ram_mb"])
              need = to_int(read_text(SERVER / ".java").strip(), 0) or (java_major(ver) if is_rel(ver) else None)
              return [java_bin(need), f"-Xms{min(512, ram)}M", f"-Xmx{ram}M",
                      *shlex.split(c["jvm_flags"]), "-jar", SOFTWARE[software_id() or "paper"]["jar"], "--nogui"]


          def start_server():
              if server_state()["state"] != "stopped":
                  raise ApiError(409, "Server sudah jalan")
              if not server_installed():
                  raise ApiError(400, "Server belum dipasang. Pilih software dan versi di menu Versi.")
              if not eula_ok():
                  raise ApiError(400, "Minecraft EULA belum disetujui (menu Pengaturan).")
              tmux("kill-session", "-t", f"={S_SRV}")
              cmd = "exec " + " ".join(shlex.quote(x) for x in server_cmd())
              r = tmux("new-session", "-d", "-s", S_SRV, "-x", "200", "-y", "50", "-c", str(SERVER), cmd,
                       ";", "set-window-option", "-t", f"={S_SRV}:", "remain-on-exit", "on")
              if r.returncode:
                  raise ApiError(500, "Gagal menjalankan tmux: " + r.stderr.strip())
              set_desired(True)
              TAILER.note("[panel] Server dijalankan…")


          def send_cmd(text):
              text = (text or "").strip().lstrip("/")
              if not text or len(text) > 500 or re.search(r"[\x00-\x1f\x7f]", text):
                  raise ApiError(400, "Perintah tidak valid")
              if server_state()["state"] == "stopped":
                  raise ApiError(409, "Server sedang mati")
              t = f"={S_SRV}:"
              tmux("send-keys", "-t", t, "-l", "--", text)
              tmux("send-keys", "-t", t, "Enter")


          def kill_server():
              set_desired(False)
              tmux("kill-session", "-t", f"={S_SRV}")


          def stop_server():
              set_desired(False)
              if server_state()["state"] == "stopped":
                  return
              try:
                  send_cmd("stop")
              except ApiError:
                  pass

              def killer():
                  for _ in range(180):
                      if server_state()["state"] == "stopped":
                          return
                      time.sleep(0.5)
                  kill_server()
              threading.Thread(target=killer, daemon=True).start()


          def restart_server():
              def run():
                  try:
                      stop_server()
                      for _ in range(240):
                          if server_state()["state"] == "stopped":
                              break
                          time.sleep(0.5)
                      time.sleep(1)
                      start_server()
                  except Exception as e:
                      TAILER.note(f"[panel] Gagal restart: {e}")
              threading.Thread(target=run, daemon=True).start()


          _prev = {}


          def proc_stats(pid):
              try:
                  rss = 0
                  for l in open(f"/proc/{pid}/status"):
                      if l.startswith("VmRSS:"):
                          rss = int(l.split()[1]) // 1024
                  st = open(f"/proc/{pid}/stat").read().rsplit(")", 1)[1].split()
                  ticks, t, cpu = int(st[11]) + int(st[12]), time.time(), None
                  p = _prev.get(pid)
                  if p and t > p[0]:
                      cpu = max(0, round((ticks - p[1]) / os.sysconf("SC_CLK_TCK") / (t - p[0]) * 100))
                  _prev[pid] = (t, ticks)
                  return {"rss_mb": rss, "cpu": cpu}
              except Exception:
                  return {"rss_mb": None, "cpu": None}


          def lan_ip():
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              try:
                  s.connect(("10.255.255.255", 1))
                  return s.getsockname()[0]
              except Exception:
                  return None
              finally:
                  s.close()


          # ───────────────────────── properti ─────────────────────────
          def read_props():
              d = {}
              for l in read_text(SERVER / "server.properties").splitlines():
                  l = l.strip()
                  if l and not l.startswith("#") and "=" in l:
                      k, v = l.split("=", 1)
                      d[k.strip()] = v.strip()
              return d


          def write_props(ch):
              for k, v in ch.items():
                  if not re.fullmatch(r"[a-z0-9.\-]{1,60}", k) or re.search(r"[\r\n]", str(v)):
                      raise ApiError(400, f"Properti tidak valid: {k}")
              p = SERVER / "server.properties"
              left, out = {k: v for k, v in ch.items()}, []
              for l in read_text(p).splitlines():
                  k = l.split("=", 1)[0].strip() if "=" in l and not l.lstrip().startswith("#") else None
                  if k in left:
                      out.append(f"{k}={left.pop(k)}")
                  else:
                      out.append(l)
              out += [f"{k}={v}" for k, v in left.items()]
              SERVER.mkdir(parents=True, exist_ok=True)
              tmp = p.with_suffix(".tmp")
              tmp.write_text("\n".join(out) + "\n")
              os.replace(tmp, p)


          # ───────────────────────── file ─────────────────────────
          def safe_path(rel, root=None):
              root = (root or SERVER).resolve()
              rel = str(rel or "").lstrip("/")
              p = (root / rel).resolve()
              if p != root and root not in p.parents:
                  raise ApiError(403, "Path di luar folder server tidak diizinkan")
              return p


          def rel_of(p):
              return "" if p == SERVER else p.relative_to(SERVER).as_posix()


          # ───────────────────────── plugin ─────────────────────────
          def jar_info(p):
              try:
                  with zipfile.ZipFile(p) as z:
                      names = z.namelist()
                      if "fabric.mod.json" in names:
                          try:
                              j = json.loads(z.read("fabric.mod.json").decode("utf-8", "replace"))
                              return {"name": str(j.get("name") or j.get("id") or p.name), "version": str(j.get("version", ""))}
                          except Exception:
                              pass
                      for n in ("paper-plugin.yml", "plugin.yml"):
                          if n in names:
                              t = z.read(n).decode("utf-8", "replace")
                              nm = re.search(r"(?m)^name:\s*['\"]?([^'\"\r\n]+)", t)
                              vr = re.search(r"(?m)^version:\s*['\"]?([^'\"\r\n]+)", t)
                              return {"name": nm.group(1).strip() if nm else p.name, "version": vr.group(1).strip() if vr else ""}
              except Exception:
                  pass
              return {"name": p.name, "version": ""}


          def need_content_dir():
              cd = content_dir()
              if not cd:
                  raise ApiError(400, "Vanilla tidak mendukung plugin atau mod. Ganti ke Paper (plugin) atau Fabric (mod) di menu Versi.")
              return cd


          def list_plugins():
              cd = content_dir()
              if not cd:
                  return []
              d = SERVER / cd
              d.mkdir(parents=True, exist_ok=True)
              out = []
              for p in sorted(d.iterdir(), key=lambda x: x.name.lower()):
                  if p.is_file() and (p.name.endswith(".jar") or p.name.endswith(".jar.disabled")):
                      out.append({"file": p.name, "enabled": p.name.endswith(".jar"), "size": p.stat().st_size, **jar_info(p)})
              return out


          def plugin_file(name):
              name = os.path.basename(str(name or ""))
              if not re.fullmatch(r"[A-Za-z0-9_.\-+() ]{1,120}\.jar(\.disabled)?", name):
                  raise ApiError(400, "Nama plugin tidak valid")
              p = SERVER / need_content_dir() / name
              if not p.is_file():
                  raise ApiError(404, "Plugin tidak ditemukan")
              return p


          def mc_version():
              return read_text(SERVER / ".mcversion").strip()


          def server_build():
              return read_text(SERVER / ".build").strip() or read_text(SERVER / ".paperbuild").strip()


          def java_available(major):
