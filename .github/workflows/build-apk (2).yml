          #!/bin/bash
          export MC_HOME="${MC_HOME:-$HOME/minecraft}"
          PY="$MC_HOME/panel/panel.py"
          S=mc-panel
          panel_alive() { [ "$(tmux list-panes -t "=$S:" -F '#{pane_dead}' 2>/dev/null | head -n1)" = "0" ]; }
          panel_port() { python3 "$PY" config | sed -n 's/.*"port": \([0-9]*\).*/\1/p'; }
          panel_start() {
            if panel_alive; then echo "Panel sudah jalan di http://localhost:$(panel_port)"; return 0; fi
            tmux kill-session -t "=$S" 2>/dev/null || true
