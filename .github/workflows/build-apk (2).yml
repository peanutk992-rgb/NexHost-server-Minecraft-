              || die "Tidak bisa mengambil $1 dari aplikasi NexHost. Buka aplikasinya lagi (jangan ditutup), salin perintah baru, lalu jalankan lagi."
            echo "$3  $2.new" | sha256sum -c --status || { rm -f "$2.new"; die "File $1 rusak atau berubah (hash tidak cocok)."; }
            mv -f "$2.new" "$2"
