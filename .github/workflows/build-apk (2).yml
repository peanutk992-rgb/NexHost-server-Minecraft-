                  : h('p', {}, s.state === 'stopped' ? 'Server sedang mati.' : 'Belum ada pemain online.')),
                card('Kelola berdasarkan nama', name, h('div', { class: 'row', style: 'margin-top:10px' },
                  [['op', 'Jadikan OP'], ['deop', 'Cabut OP'], ['wl-add', 'Tambah whitelist'], ['wl-remove', 'Hapus whitelist'], ['ban', 'Ban'], ['pardon', 'Unban']]
                    .map(([a, l]) => h('button', { class: 'btn small', onclick: () => name.value.trim() ? cmd(a, name.value.trim()) : toast('Isi nama pemain dulu', true) }, l))),
                h('p', { class: 'small' }, 'Whitelist hanya berlaku kalau diaktifkan di Pengaturan.')));
            };
            if (S.st) S.onStatus(S.st);
          }

          // ─────────── Dunia
          function pageWorlds() {
            const box = h('div', { class: 'stack' });
            $('#view').replaceChildren(box);
            let d = null;
            const stopped = () => !S.st || S.st.state === 'stopped';
            const needStop = () => { if (!stopped()) { toast('Matikan server dulu untuk aksi ini', true); return true; } return false; };
            const cmd = async (c, ok) => { const r = await run(() => api('POST', '/api/server/command', { cmd: c }), null); if (r) toast(ok || 'Terkirim: ' + c); };
            const newModal = () => {
              const n = h('input', { class: 'inp', placeholder: 'Nama dunia, mis. survival2', maxlength: 40 });
              const seed = h('input', { class: 'inp', placeholder: 'Seed (kosongkan untuk acak)' });
              const ty = h('select', {}, [['default', 'Normal'], ['flat', 'Superflat'], ['large_biomes', 'Biome besar'], ['amplified', 'Amplified']].map(([v, l]) => h('option', { value: v }, l)));
              modal('Dunia baru', h('div', { class: 'stack' }, n, seed, ty, h('p', { class: 'small' }, 'Dunia baru langsung jadi dunia aktif dan dibuat saat server dinyalakan.')),
                [{ label: 'Buat', cls: 'primary', fn: async close => { const r = await api('POST', '/api/worlds/new', { name: n.value, seed: seed.value, type: ty.value }); toast(r.note); close(); load(); } }]);
            };
            const load = async () => {
              try { d = await api('GET', '/api/worlds'); } catch (e) { toast(e.message, true); return; }
              box.replaceChildren(
                head('Dunia', 'Dunia aktif: ' + d.active, btnI('plus', 'Dunia baru', { class: 'btn primary', onclick: () => { if (!needStop()) newModal(); } }),
                  btnI('upload', 'Unggah .zip', { class: 'btn', onclick: () => { if (!needStop()) pickFile('.zip', f => run(async () => { const r = await putFile('/api/worlds/upload?world=' + encodeURIComponent(f.name.replace(/\.zip$/i, '').replace(/[^A-Za-z0-9._-]/g, '_').slice(0, 40)) + '&activate=1', f); await load(); return r; }, r => 'Dunia ' + r.name + ' dipasang dan diaktifkan')); } })),
                stopped() ? null : note('', 'Server sedang menyala. Ganti, hapus, reset, dan unggah dunia butuh server mati.'),
                h('div', { class: 'grid2' }, d.worlds.map(w => h('div', { class: 'card wcard' + (w.active ? ' on' : '') },
                  h('div', { class: 'row sp' }, h('h2', {}, w.name), w.active ? h('span', { class: 'chip j' }, 'aktif') : null),
                  h('p', { class: 'small' }, w.missing ? 'Belum dibuat, muncul saat server pertama jalan.' : fmtB(w.size) + (w.dims.length ? ', ' + w.dims.length + ' dimensi tambahan' : '') + ', ' + fmtT(w.mtime)),
                  h('div', { class: 'row' },
                    !w.active && h('button', { class: 'btn small primary', onclick: ev => !needStop() && run(async () => { await api('POST', '/api/worlds/activate', { name: w.name }); await load(); }, 'Dunia diaktifkan. Nyalakan server.', ev.currentTarget) }, 'Jadikan aktif'),
                    !w.missing && h('a', { class: 'btn small', href: '/api/worlds/download?name=' + encodeURIComponent(w.name) }, 'Unduh'),
                    w.active && !w.missing && h('button', { class: 'btn small danger', onclick: ev => !needStop() && confirm('Reset dunia aktif? Dunia dipindah ke _before-reset, lalu dibuat baru.') && run(async () => { await api('POST', '/api/worlds/reset', {}); await load(); }, 'Dunia direset', ev.currentTarget) }, 'Reset'),
                    !w.active && h('button', { class: 'btn small danger', onclick: ev => !needStop() && confirm('Hapus dunia ' + w.name + ' selamanya?') && run(async () => { await api('POST', '/api/worlds/delete', { name: w.name }); await load(); }, 'Dunia dihapus', ev.currentTarget) }, 'Hapus')))))
                , h('p', { class: 'small' }, 'Seed dunia: ' + (d.seed || '(acak)') + '. Seed baru hanya berlaku untuk dunia yang baru dibuat.'),
                card('Kontrol dalam game', note('', 'Server harus menyala. Nama gamerule bisa beda antar versi, jadi kalau gagal klik lagi tombol alternatif di Konsol.'),
                  h('div', { class: 'row' }, h('span', { class: 'lbl2' }, 'Waktu'),
                    [['Pagi', 'time set day'], ['Siang', 'time set noon'], ['Malam', 'time set night'], ['Tengah malam', 'time set midnight']].map(([l, c]) => btnI(l === 'Malam' || l === 'Tengah malam' ? 'moon' : 'sun', l, { class: 'btn small', onclick: () => cmd(c) }))),
                  h('div', { class: 'row' }, h('span', { class: 'lbl2' }, 'Cuaca'),
                    [['Cerah', 'weather clear'], ['Hujan', 'weather rain'], ['Badai', 'weather thunder']].map(([l, c]) => btnI('rain', l, { class: 'btn small', onclick: () => cmd(c) }))),
                  h('div', { class: 'row' }, h('span', { class: 'lbl2' }, 'Kesulitan'),
                    ['peaceful', 'easy', 'normal', 'hard'].map(x => h('button', { class: 'btn small', onclick: () => cmd('difficulty ' + x) }, x))),
                  h('div', { class: 'row' }, h('span', { class: 'lbl2' }, 'Lainnya'),
                    h('button', { class: 'btn small', onclick: () => cmd('seed') }, 'Lihat seed'),
                    h('button', { class: 'btn small', onclick: () => cmd('worldborder set 5000', 'Batas dunia 5000 blok') }, 'Batas 5000'),
                    h('button', { class: 'btn small', onclick: () => cmd('save-all', 'Dunia disimpan') }, 'Simpan dunia'),
                    h('button', { class: 'btn small', onclick: () => cmd('gamerule keepInventory true') }, 'Keep inventory'),
                    h('button', { class: 'btn small', onclick: () => cmd('gamerule keep_inventory true') }, 'Keep inventory (versi baru)'))));
            };
            S.onStatus = () => {};
            load();
          }

          // ─────────── Versi
          function pageVersions() {
            const box = h('div', { class: 'stack' });
            $('#view').replaceChildren(box);
            S.onStatus = () => {};
            let sw = null, snaps = false, list = [], pick = '', loading = false, info = null;
            const DESC = { paper: 'Cepat, mendukung plugin. Pilihan paling umum.', purpur: 'Turunan Paper dengan banyak opsi tambahan, mendukung plugin.',
              vanilla: 'Server resmi Mojang, tanpa plugin atau mod.', fabric: 'Ringan, untuk mod Fabric.' };
            const draw = () => {
              const cur = info && info.current;
              box.replaceChildren(head('Versi server', cur ? 'Terpasang: ' + (info.software_name || cur) + ' ' + (info.version || '') : 'Belum ada server terpasang'),
                S.st && S.st.state !== 'stopped' ? note('bad', 'Matikan server dulu sebelum mengganti software atau versi.') : null,
                h('div', { class: 'grid2' }, info.software.map(x => h('button', { class: 'card pickcard' + (sw === x.id ? ' on' : ''), onclick: () => { sw = x.id; pick = ''; fetchV(); } },
                  h('h2', {}, x.name), h('p', { class: 'small' }, DESC[x.id] || ''), x.id === cur ? h('span', { class: 'chip j' }, 'terpasang') : null))),
                card('Pilih versi ' + (info.software.find(x => x.id === sw) || {}).name,
