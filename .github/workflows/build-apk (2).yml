          cat > app/assets/app.js <<'__EOF_APP_JS__'
          'use strict';
          const $ = (s, r = document) => r.querySelector(s);

          function h(tag, attrs, ...kids) {
            const el = document.createElement(tag);
            const late = {};
            for (const [k, v] of Object.entries(attrs || {})) {
              if (v == null || v === false) continue;
              if (k === 'class') el.className = v;
              else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
              else if (k === 'value' || k === 'checked') late[k] = v;
              else el.setAttribute(k, v === true ? '' : v);
            }
            for (const kid of kids.flat(Infinity)) {
              if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
            }
            for (const [k, v] of Object.entries(late)) el[k] = v;
            return el;
          }

          // ── ikon garis (SVG dibuat lewat DOM, tanpa innerHTML)
          const ICONS = {
            dash: 'M4 4h7v7H4z M13 4h7v4h-7z M13 10h7v10h-7z M4 13h7v7H4z',
            console: 'M4 6l5 5-5 5 M12 17h8',
            players: 'M16 8.5a3.5 3.5 0 1 0-7 0 3.5 3.5 0 0 0 7 0z M5 20v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1',
            world: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M3 12h18 M12 3c3 3 3 15 0 18 M12 3c-3 3-3 15 0 18',
            plugins: 'M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5l8 4.5 8-4.5 M12 12v9',
            files: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
            backups: 'M4 5h16v4H4z M6 9v10h12V9 M10 13h4',
            address: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',
            versions: 'M12 4v11 M7 10l5 5 5-5 M5 20h14',
            settings: 'M4 7h9 M17 7h3 M4 17h3 M11 17h9 M15 4v6 M9 14v6',
            play: 'M8 5l11 7-11 7z', stop: 'M7 7h10v10H7z', restart: 'M4 12a8 8 0 1 0 2.5-5.8 M4 4v5h5',
            copy: 'M9 9h11v11H9z M5 15H4V4h11v1', check: 'M5 12l5 5 9-10', edit: 'M4 20h4L19 9l-4-4L4 16z',
            trash: 'M5 7h14 M10 7V4h4v3 M7 7l1 13h8l1-13', download: 'M12 4v11 M7 10l5 5 5-5 M5 20h14',
            upload: 'M12 20V9 M7 14l5-5 5 5 M5 4h14', logout: 'M10 5H5v14h5 M14 8l4 4-4 4 M18 12H9',
            menu: 'M4 7h16 M4 12h16 M4 17h16', refresh: 'M4 12a8 8 0 0 1 14-5 M20 4v5h-5 M20 12a8 8 0 0 1-14 5 M4 20v-5h5',
            plus: 'M12 5v14 M5 12h14', bolt: 'M13 3L5 14h6l-1 7 8-11h-6z', ram: 'M4 8h16v8H4z M8 8v8 M12 8v8 M16 8v8',
            clock: 'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16z M12 8v4l3 2', tag: 'M4 4h8l8 8-8 8-8-8z M8.5 8.5h.01',
            sun: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 3v2 M12 19v2 M3 12h2 M19 12h2 M5.6 5.6l1.4 1.4 M17 17l1.4 1.4 M5.6 18.4L7 17 M17 7l1.4-1.4',
            rain: 'M7 15a4 4 0 0 1-.5-8A5 5 0 0 1 16 6a4 4 0 0 1 1 8 M8 18l-1 3 M12 18l-1 3 M16 18l-1 3',
            moon: 'M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z', info: 'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16z M12 11v5 M12 8h.01',
            warn: 'M12 4l9 16H3z M12 10v4 M12 17h.01', link: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',
            wifi: 'M3 9a14 14 0 0 1 18 0 M6 12.5a9 9 0 0 1 12 0 M9 16a4.5 4.5 0 0 1 6 0 M12 19.5h.01', server: 'M4 5h16v5H4z M4 14h16v5H4z M8 7.5h.01 M8 16.5h.01',
          };
          function ico(name, size) {
            const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            s.setAttribute('viewBox', '0 0 24 24');
            s.setAttribute('class', 'ico');
            s.setAttribute('aria-hidden', 'true');
            if (size) { s.setAttribute('width', size); s.setAttribute('height', size); }
            const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            p.setAttribute('d', ICONS[name] || '');
            s.append(p);
            return s;
          }
          const btnI = (icon, label, attrs) => h('button', attrs, ico(icon), label ? h('span', {}, label) : null);

          // ── ikon server: blok rumput 16x16 piksel (acak tetap, selalu sama)
          function blockIcon(px) {
            const NS = 'http://www.w3.org/2000/svg', s = document.createElementNS(NS, 'svg');
            s.setAttribute('viewBox', '0 0 16 16');
            s.setAttribute('width', px);
            s.setAttribute('height', px);
            s.setAttribute('class', 'block');
            s.setAttribute('shape-rendering', 'crispEdges');
            s.setAttribute('aria-hidden', 'true');
            let seed = 7;
            const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
            const grass = ['#4e9a2f', '#5ca83a', '#67b845', '#438a29'], dirt = ['#86583a', '#774b2e', '#94663f', '#6a4228'];
            for (let y = 0; y < 16; y++) {
              for (let x = 0; x < 16; x++) {
                const top = y < 5 || (y < 7 && rnd() < (7 - y) * 0.22);
                const pal = top ? grass : dirt;
                const r = document.createElementNS(NS, 'rect');
                r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', 1); r.setAttribute('height', 1);
                r.setAttribute('fill', pal[Math.floor(rnd() * pal.length)]);
                s.append(r);
              }
            }
            return s;
          }

          // ── teks Minecraft berwarna (kode § atau &) untuk MOTD
          const MC_COL = { 0: '#7c8a82', 1: '#5f73ff', 2: '#2fbf4f', 3: '#2fbfbf', 4: '#e0524d', 5: '#c04fe0', 6: '#ffaa00', 7: '#aaaaaa', 8: '#8a8a8a',
            9: '#6f6fff', a: '#55ff55', b: '#55ffff', c: '#ff5555', d: '#ff55ff', e: '#ffff55', f: '#ffffff' };
          function mcText(str) {
            const out = [];
            let st = {}, buf = '';
            const flush = () => {
              if (!buf) return;
              const css = [st.c ? 'color:' + st.c : '', st.l ? 'font-weight:800' : '', st.o ? 'font-style:italic' : '',
                (st.n || st.m) ? 'text-decoration:' + [st.n ? 'underline' : '', st.m ? 'line-through' : ''].join(' ') : ''].filter(Boolean).join(';');
              out.push(css ? h('span', { style: css }, buf) : buf);
              buf = '';
            };
            const s = String(str || '');
            for (let i = 0; i < s.length; i++) {
              if ((s[i] === '§' || s[i] === '&') && i + 1 < s.length && /[0-9a-fk-or]/i.test(s[i + 1])) {
                flush();
                const k = s[++i].toLowerCase();
                if (MC_COL[k]) st = { c: MC_COL[k] };
                else if (k === 'r') st = {};
                else if ('lonm'.includes(k)) st = { ...st, [k]: true };
              } else buf += s[i];
            }
            flush();
            return out;
          }

          const LABEL = { running: 'Berjalan', starting: 'Menyala…', stopping: 'Berhenti…', stopped: 'Mati' };
          const S = { st: null, timers: [], onStatus: null, poll: null, addr: null };

          const fmtB = n => n == null ? '-' : n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB'
            : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
          const fmtDur = s => {
            s = Math.max(0, Math.floor(s));
            const d = Math.floor(s / 86400), j = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
            return d ? d + 'h ' + j + 'j' : j ? j + 'j ' + m + 'm' : m + ' menit';
          };
          const fmtT = t => t ? new Date(t * 1000).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '-';

          function toast(msg, bad) {
            const t = h('div', { class: 'toast' + (bad ? ' bad' : '') }, msg);
            $('#toasts').append(t);
            setTimeout(() => t.remove(), bad ? 7000 : 3200);
          }

          async function copy(text, what) {
            try { await navigator.clipboard.writeText(text); } catch (e) {
              const ta = h('textarea', { style: 'position:fixed;opacity:0' }, text);
              document.body.append(ta);
              ta.select();
              try { document.execCommand('copy'); } catch (e2) { /* tidak bisa menyalin */ }
              ta.remove();
            }
            toast((what || 'Disalin') + ': ' + text);
          }

          function modal(title, body, actions) {
            const close = () => m.remove();
            const m = h('div', { class: 'modal', onclick: e => { if (e.target === m) close(); } },
              h('div', { class: 'box' },
                h('div', { class: 'row sp' }, h('h2', {}, title), h('button', { class: 'btn small ghost', onclick: close }, 'Tutup')),
                body,
                h('div', { class: 'row', style: 'margin-top:14px' }, (actions || []).map(a =>
                  h('button', {
                    class: 'btn ' + (a.cls || ''), onclick: async ev => {
                      const b = ev.currentTarget; b.disabled = true;
                      try { await a.fn(close); } catch (e) { toast(e.message, true); } finally { b.disabled = false; }
                    }
                  }, a.label)))));
            document.body.append(m);
            return close;
          }

          async function api(method, path, body, raw) {
            const opt = { method, headers: { 'X-Panel': '1' }, credentials: 'same-origin' };
            if (raw) opt.body = raw;
            else if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
            let r;
            try { r = await fetch(path, opt); } catch (e) { throw new Error('Tidak bisa menghubungi panel. Pastikan Termux masih jalan.'); }
            let j = {};
            try { j = await r.json(); } catch (e) { /* bukan JSON */ }
            if (r.status === 401 && path !== '/api/login') { showLogin(); throw new Error('Silakan masuk lagi'); }
            if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
            return j;
          }

          // unggah dengan indikator kemajuan (fetch belum bisa melaporkan kemajuan unggahan)
          function putFile(url, file, onProgress) {
            return new Promise((resolve, reject) => {
              const x = new XMLHttpRequest();
              x.open('PUT', url);
              x.setRequestHeader('X-Panel', '1');
              x.upload.onprogress = e => { if (onProgress && e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100)); };
              x.onerror = () => reject(new Error('Unggahan gagal. Cek koneksi ke panel.'));
              x.onload = () => {
                let j = {};
                try { j = JSON.parse(x.responseText); } catch (e) { /* bukan JSON */ }
                if (x.status >= 200 && x.status < 300) resolve(j); else reject(new Error(j.error || 'Unggahan gagal (' + x.status + ')'));
              };
              x.send(file);
            });
          }
          const upload = (dir, file, onProgress) =>
            putFile('/api/files/upload?path=' + encodeURIComponent(dir) + '&name=' + encodeURIComponent(file.name), file, onProgress);

          function pickFile(accept, cb) {
            const i = h('input', { type: 'file', accept: accept || null, style: 'display:none' });
            i.addEventListener('change', () => { if (i.files[0]) cb(i.files[0]); i.remove(); });
            document.body.append(i);
            i.click();
          }

          async function run(fn, ok, btn) {
            if (btn) btn.disabled = true;
            try {
              const r = await fn();
              if (ok) toast(typeof ok === 'function' ? ok(r) : ok);
              return r;
            } catch (e) { toast(e.message, true); } finally {
              if (btn) btn.disabled = false;
              refreshStatus();
            }
          }
          const act = (fn, ok) => ev => run(fn, ok, ev.currentTarget);
          const every = (ms, fn) => S.timers.push(setInterval(fn, ms));
          function reset() { S.timers.forEach(clearInterval); S.timers = []; S.onStatus = null; }
          const kv = (k, v) => h('div', { class: 'kv' }, h('span', {}, k), h('b', {}, v));
          const note = (cls, ...kids) => h('div', { class: 'note ' + cls }, ...kids);
          const card = (title, ...kids) => h('section', { class: 'card' }, title ? h('h2', {}, title) : null, ...kids);
          const head = (title, sub, ...actions) => h('div', { class: 'phead' }, h('div', {}, h('h1', {}, title), sub ? h('p', {}, sub) : null), h('div', { class: 'row' }, actions));
          const meter = (pct, cls) => h('div', { class: 'meter ' + (cls || (pct > 85 ? 'max' : pct > 65 ? 'hot' : '')) }, h('i', { style: 'width:' + Math.max(0, Math.min(100, pct)) + '%' }));

          // ─────────── Kerangka: sidebar, router, login
          const IN_APP = /NexHostApp/.test(navigator.userAgent);
          const TABS = [
            ['dash', 'Ringkasan', 'dash'], ['console', 'Konsol', 'console'], ['players', 'Pemain', 'players'],
            ['worlds', 'Dunia', 'world'], ['versions', 'Versi', 'versions'], ['address', 'Alamat', 'address'],
            ['plugins', 'Plugin', 'plugins'], ['files', 'File', 'files'], ['backups', 'Backup', 'backups'],
            ['bedrock', 'Bedrock', 'bedrock'], ['tunnel', 'Tunnel', 'wifi'], ['settings', 'Pengaturan', 'settings']];

          function logo(px) {
            const NS = 'http://www.w3.org/2000/svg', s = document.createElementNS(NS, 'svg');
            s.setAttribute('viewBox', '0 0 32 32');
            s.setAttribute('width', px);
            s.setAttribute('height', px);
            s.setAttribute('class', 'logo');
            s.setAttribute('aria-hidden', 'true');
            const mk = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); s.append(e); };
            mk('rect', { x: 1.5, y: 1.5, width: 29, height: 29, rx: 8, fill: '#0c2a19', stroke: '#3ddc6c', 'stroke-width': 1.5 });
            mk('path', { d: 'M9.5 23V9h2.6l7.8 9.4V9h2.6v14h-2.6l-7.8-9.4V23z', fill: '#3ddc6c' });
            return s;
          }

          function paintSide(s) {
            const p = $('#pill');
            if (p) {
              p.className = 'pill ' + s.state;
              p.lastChild.textContent = LABEL[s.state] + (s.state === 'running' ? ' · ' + s.players.length + '/' + s.max_players : '');
            }
            const n = $('#side-name');
            if (n) n.textContent = s.server_name || 'NexHost Server';
            const pl = $('#nav-plugins span');
            if (pl) pl.textContent = s.content_kind === 'mod' ? 'Mod' : 'Plugin';
          }

          async function refreshStatus() {
            try { S.st = await api('GET', '/api/status'); } catch (e) { return; }
            paintSide(S.st);
            if (S.onStatus) S.onStatus(S.st);
          }

          async function logout() {
            try { await api('POST', '/api/logout'); } catch (e) { /* abaikan */ }
            location.reload();
          }

          function shell() {
            $('#app').replaceChildren(h('div', { class: 'app' },
              h('aside', { class: 'side' },
                h('div', { class: 'brand' }, logo(30), h('div', { class: 'bt' }, h('b', {}, 'NexHost'), h('small', { id: 'side-name' }, 'Panel server'))),
                h('span', { id: 'pill', class: 'pill stopped' }, h('i', { class: 'dot' }), h('span', {}, '…')),
                h('nav', { class: 'tabs', id: 'tabs' }, TABS.map(([k, l, i]) => h('a', { href: '#' + k, id: 'nav-' + k, 'data-k': k }, ico(i), h('span', {}, l)))),
                h('div', { class: 'sfoot' },
                  IN_APP ? h('a', { class: 'tab', href: 'nexhost://menu', id: 'nav-menu' }, ico('menu'), h('span', {}, 'Menu')) : null,
                  h('a', { class: 'tab', href: '#', id: 'nav-out', onclick: e => { e.preventDefault(); logout(); } }, ico('logout'), h('span', {}, 'Keluar')))),
              h('main', { id: 'view', class: 'view' })));
          }

          const PAGES = {
            dash: pageDash, console: pageConsole, players: pagePlayers, worlds: pageWorlds, versions: pageVersions, address: pageAddress,
            plugins: pagePlugins, files: pageFiles, backups: pageBackups, bedrock: pageBedrock, tunnel: pageTunnel, settings: pageSettings,
          };

          function go() {
            reset();
            const k = (location.hash || '#dash').slice(1);
            const key = PAGES[k] ? k : 'dash';
            document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.k === key));
            const v = $('#view');
            if (v) v.scrollTop = 0;
            PAGES[key]();
            if (S.st && S.onStatus) S.onStatus(S.st);
          }

          function showLogin(configured) {
            reset();
            clearInterval(S.poll);
            const inp = h('input', { class: 'inp', type: 'password', placeholder: 'Password panel', autocomplete: 'current-password' });
            const enter = async () => {
              try { await api('POST', '/api/login', { password: inp.value }); start(); } catch (e) { toast(e.message, true); }
            };
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
            $('#app').replaceChildren(h('div', { class: 'login' }, h('div', { class: 'card lbox' },
              h('div', { class: 'lhead' }, logo(44), h('div', {}, h('h1', {}, 'NexHost'), h('p', {}, 'Masuk untuk mengelola server'))),
              configured === false ? note('bad', 'Password belum dibuat. Di Termux jalankan: mc passwd') : null,
              inp,
              h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'btn primary grow', onclick: enter }, 'Masuk')),
              h('p', { class: 'small' }, 'Lupa password? Di Termux jalankan: mc passwd'))));
            inp.focus();
          }

          async function start() {
            let s;
            try { s = await api('GET', '/api/session'); } catch (e) {
              $('#app').replaceChildren(h('div', { class: 'login' }, h('div', { class: 'card lbox' },
                h('h2', {}, 'Panel tidak bisa dihubungi'), h('p', {}, e.message), h('button', { class: 'btn', onclick: () => location.reload() }, 'Coba lagi'))));
              return;
            }
            if (!s.authed) return showLogin(s.configured);
            shell();
            await refreshStatus();
            go();
            clearInterval(S.poll);
            S.poll = setInterval(refreshStatus, 2500);
          }

          // ─────────── Ringkasan
          const iconBtn = (icon, label, fn, cls) => h('button', { class: 'icon-btn ' + (cls || ''), title: label, 'aria-label': label, onclick: fn }, ico(icon));

          // baris alamat yang bisa disalin; tidak pernah menampilkan localhost
          function joinLines(o) {
            const rows = [h('div', { class: 'join' }, h('span', { class: 'chip j' }, 'Java'), h('code', {}, o.java),
              iconBtn('copy', 'Salin alamat Java', () => copy(o.java, 'Alamat Java disalin')))];
