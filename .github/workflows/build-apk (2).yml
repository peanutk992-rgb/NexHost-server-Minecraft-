          .bars{display:flex;gap:3px;align-items:flex-end;justify-content:flex-end;height:18px}.bars i{width:5px;background:#2a3a31;border-radius:2px}
          .bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:9px}.bars i:nth-child(3){height:12px}.bars i:nth-child(4){height:15px}.bars i:nth-child(5){height:18px}
          .bars i.on{background:var(--g)}.lbl{font-size:11px;color:var(--mut)}
          .hero-bot{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
          .joins{display:flex;flex-direction:column;gap:6px;min-width:0}.join{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
          .join code{background:#00000066;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13px;overflow-wrap:anywhere}
          .hint{font-size:12px;color:var(--mut)}.ctl{display:flex;gap:8px;flex-wrap:wrap}.opt{padding:8px 0;border-top:1px solid var(--line)}.opt:first-of-type{border:0}
          .btn,button,select,.inp,textarea{font:inherit}
          .btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card2);color:var(--txt);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600}
          .btn:hover{border-color:#2f5a40}.btn:disabled{opacity:.5}.btn.primary{background:var(--g);color:#04170b;border-color:var(--g)}
          .btn.danger{color:var(--bad);border-color:#4a2424}.btn.ghost{background:none}.btn.small{padding:4px 10px;font-size:12.5px;border-radius:8px}.btn.big{padding:10px 18px}
          .icon-btn{display:inline-flex;border:0;background:none;color:var(--mut);padding:5px;border-radius:8px;cursor:pointer}.icon-btn:hover{color:var(--g);background:#ffffff0d}
          .inp,select,textarea{width:100%;background:#070c09;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
          .inp:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:1px}
          textarea{min-height:46vh;resize:vertical}label.f{display:block;margin:10px 0 4px;font-size:12.5px;color:var(--mut)}
          label.sw{display:flex;gap:8px;align-items:center;margin:8px 0}input[type=checkbox]{accent-color:var(--g);width:17px;height:17px}
          .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
          .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.tl{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12px}
          .tv{font-size:20px;font-weight:700;margin-top:2px}.ts{font-size:11.5px;color:var(--mut)}
          .meter{height:6px;background:#1a261f;border-radius:4px;margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--g)}.meter.hot i{background:var(--warn)}.meter.max i{background:var(--bad)}
          .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.kv span{color:var(--mut)}
          .list{display:flex;flex-direction:column}.it{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}.it:first-child{border:0}
          .it .nm{flex:1;min-width:140px;overflow-wrap:anywhere}.it img{width:32px;height:32px;border-radius:8px}
          .tag{display:inline-block;background:var(--gd);color:var(--g);padding:2px 10px;border-radius:99px;margin:2px 4px 2px 0;cursor:pointer}
          .note{border:1px solid var(--line);border-left:3px solid var(--mut);border-radius:10px;padding:9px 12px;margin:8px 0;background:var(--card);color:var(--txt)}
          .note.ok{border-left-color:var(--g)}.note.bad{border-left-color:var(--bad)}
          .out,.log{background:#030504;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:8px 0}
          .log{height:42vh;margin:0}.log .e{color:var(--bad)}.log .w{color:var(--warn)}.log .n{color:var(--g)}.log .echo{color:#6fd6f0}
          .consolebox{height:100%}.consolebox .card{display:flex;flex-direction:column;min-height:0}.consolebox .log{flex:1;height:auto;min-height:120px}
          .crumbs{font-size:13px}.pickcard{text-align:left;cursor:pointer;color:var(--txt)}.pickcard.on,.wcard.on{border-color:var(--g);box-shadow:0 0 0 1px var(--g) inset}
          .vers{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto;margin-top:8px}.vbtn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
          .vbtn.on{background:var(--g);color:#04170b;border-color:var(--g)}.lbl2{min-width:70px;color:var(--mut)}
          .steps{margin:0;padding-left:18px;color:var(--mut)}.steps li{margin:4px 0}
          .step{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.step:first-of-type{border:0}.sn{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
          .step.done .sn{background:var(--g);border-color:var(--g);color:#04170b}.sb{flex:1;min-width:0}
          .modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
          .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(560px,100%);max-height:92vh;overflow:auto}
          #toasts{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:30;max-width:min(420px,90vw)}
          .toast{background:#14281c;border:1px solid var(--g2);padding:9px 13px;border-radius:10px}.toast.bad{background:#2a1515;border-color:#7a3030}
          .login{height:100%;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}.lbox{width:min(380px,100%)}.lhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
          @media(max-width:719px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:6px}
          .tabs{flex-direction:row;overflow-x:auto;order:5;width:100%}.tabs a span{white-space:nowrap}.sfoot{margin:0 0 0 auto;flex-direction:row}.tab span{display:none}.bt small{max-width:90px}}
          @media(max-height:460px) and (min-width:720px){.view{padding:10px 12px}.tabs a{padding:5px 10px}.hero{padding:10px;gap:8px}.sname{font-size:18px}.block{width:48px;height:48px}.side{gap:6px;padding:8px}}
          @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
          __EOF_APP_CSS__

          echo "File sumber ditulis:"; find app -type f | sort

      - name: Bangun APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK/build-tools" ] || { echo "Android SDK tidak ketemu di $SDK"; exit 1; }
          BTV="$(ls "$SDK/build-tools" | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -n1)"
          PLV="$(ls "$SDK/platforms" | grep -E '^android-[0-9]+$' | sort -V | tail -n1)"
          BT="$SDK/build-tools/$BTV"
          AJ="$SDK/platforms/$PLV/android.jar"
          echo "build-tools $BTV, platform $PLV"
          test -f "$AJ"
          cd app
          rm -rf build
          mkdir -p build/classes build/dex
          "$BT/aapt2" compile --dir res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$AJ" --manifest AndroidManifest.xml -A assets \
            --min-sdk-version 24 --target-sdk-version 33 --version-code 1 --version-name 1.0 build/res.zip
          javac -encoding UTF-8 -source 8 -target 8 -Xlint:-options -bootclasspath "$AJ" \
            -d build/classes $(find java -name '*.java')
          "$BT/d8" --release --lib "$AJ" --min-api 24 --output build/dex $(find build/classes -name '*.class')
          cp build/base.apk build/unsigned.apk
          (cd build/dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -keystore build/debug.keystore -storepass android -keypass android \
            -alias nexhost -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NexHost"
          "$BT/apksigner" sign --ks build/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out ../NexHost.apk build/aligned.apk
          "$BT/apksigner" verify --print-certs ../NexHost.apk
          ls -l ../NexHost.apk

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexHost-apk
          path: NexHost.apk
          if-no-files-found: error

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: NexHost build ${{ github.run_number }}
          body: APK NexHost. Pasang, lalu ikuti langkah 1 sampai 3 di layar aplikasi.
          files: NexHost.apk
          make_latest: true

      - name: Tulis ringkasan cara unduh
        if: always()
        run: |
          {
            echo "## NexHost"
            if [ -f NexHost.apk ]; then
              echo "APK berhasil dibuat: $(du -h NexHost.apk | cut -f1)."
              echo ""
              echo "Unduh dari salah satu:"
              echo "- Releases: https://github.com/$GITHUB_REPOSITORY/releases"
              echo "- Artifacts (zip, di bagian paling bawah halaman run ini): https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            else
              echo "APK tidak terbuat. Buka langkah yang gagal di job build dan lihat lognya."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
