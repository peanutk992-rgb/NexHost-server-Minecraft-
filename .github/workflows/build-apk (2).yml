          @route("PUT", "/api/files/upload")
          def api_upload(c):
              d = safe_path(c.q.get("path", ""))
              name = os.path.basename(c.q.get("name", ""))
              if not d.exists() and name:
                  d.mkdir(parents=True, exist_ok=True)  # mis. folder plugins/ belum ada sebelum server pertama jalan
              if not d.is_dir() or not name or name in (".", ".."):
                  raise ApiError(400, "Tujuan tidak valid")
              dest = safe_path(rel_of(d) + "/" + name)
              n = to_int(c.h.headers.get("Content-Length"), 0)
              lim = to_int(load_cfg()["upload_max_mb"], 512) * 1048576
              if n <= 0:
                  raise ApiError(400, "Isi file kosong")
              if n > lim:
                  raise ApiError(413, f"File melebihi batas {lim // 1048576} MB")
              tmp, left = dest.with_name(dest.name + ".part"), n
              try:
                  with open(tmp, "wb") as f:
                      while left > 0:
                          ch = c.h.rfile.read(min(65536, left))
                          if not ch:
                              break
                          f.write(ch)
                          left -= len(ch)
                  if left > 0:
                      raise ApiError(400, "Unggahan terputus")
                  os.replace(tmp, dest)
              finally:
                  tmp.unlink(missing_ok=True)
              return {"name": name, "size": n}


