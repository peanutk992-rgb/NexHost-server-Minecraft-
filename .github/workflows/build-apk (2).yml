          # ───────────────────────── CLI ─────────────────────────
          def serve():
              for d in (SERVER, PANEL, BACKUPS, TUNNEL):
                  d.mkdir(parents=True, exist_ok=True)
              c = load_cfg()
              TAILER.start()
              threading.Thread(target=watchdog, daemon=True).start()
              try:
                  srv = Srv((c["bind"], int(c["port"])), H)
              except OSError as e:
                  print(f"Gagal membuka port {c['port']}: {e}\nCoba: mc config port 8081", file=sys.stderr)
                  sys.exit(1)
              print(f"Panel jalan di http://{c['bind']}:{c['port']}", flush=True)
              srv.serve_forever()


          def cli_tail():
              """Perintah CLI tidak punya pembaca log. Nyalakan dulu supaya status dan backup tahu server sudah siap atau belum."""
              if not TAILER.is_alive():
                  while TAILER.poll_once():
                      pass
                  TAILER.start()


          def cli_server(args):
              act = args[0] if args else "status"
              if act == "start":
                  start_server()
                  print("Server dijalankan. Lihat konsol: mc console")
              elif act == "stop":
                  if server_state()["state"] == "stopped":
                      print("Server sudah mati")
                      return
                  stop_server()
                  print("Menghentikan server", end="", flush=True)
                  for _ in range(190):
                      if server_state()["state"] == "stopped":
                          print(" selesai")
                          return
                      print(".", end="", flush=True)
                      time.sleep(1)
              elif act == "restart":
                  stop_server()
                  for _ in range(180):
                      if server_state()["state"] == "stopped":
                          break
                      time.sleep(1)
                  start_server()
                  print("Server dijalankan ulang")
              elif act == "kill":
                  kill_server()
                  print("Server dipaksa berhenti")
              else:
                  cli_tail()
                  st = server_state()
                  print({"running": "Berjalan", "starting": "Menyala…", "stopping": "Berhenti…", "stopped": "Mati"}[st["state"]])


          def main(argv):
              cmd = argv[1] if len(argv) > 1 else "serve"
              rest = argv[2:]
              try:
                  if cmd == "serve":
                      serve()
                  elif cmd == "init":
                      for d in (SERVER, PANEL, BACKUPS, TUNNEL):
                          d.mkdir(parents=True, exist_ok=True)
                      save_cfg(load_cfg())
                  elif cmd == "server":
                      cli_server(rest)
                  elif cmd == "install-paper":
                      r = install_paper(rest[0] if rest else None)
                      print(f"Paper {r['version']} build {r['build']} terpasang")
                      print(f"JAVA_MAJOR={r['java']}")
                  elif cmd == "install-server":
                      if not rest:
                          sys.exit("Pakai: install-server <paper|purpur|vanilla|fabric> [versi]")
                      r = install_server(rest[0], rest[1] if len(rest) > 1 else None)
                      print(f"{SOFTWARE[r['software']]['name']} {r['version']} ({r['build']}) terpasang")
                      if r["note"]:
                          print("Catatan:", r["note"])
                      print(f"JAVA_MAJOR={r['java']}")
                  elif cmd == "address":
                      a = address_info()
                      if not a["options"]:
                          print("Belum ada alamat. Atur domain: mc config set public_host servermc.play.id")
                      for o in a["options"]:
                          print(f"{o['label']:<18} Java: {o['java']}" + (f"   Bedrock: {o['host']}:{o['bedrock_port']}" if o["bedrock_port"] else ""))
                  elif cmd == "install-geyser":
                      print("Terpasang:", ", ".join(install_geyser()))
                  elif cmd == "install-playit":
                      print("Terpasang:", install_playit()["file"])
                  elif cmd == "java-major":
                      print(java_major(rest[0]) if rest else 21)
                  elif cmd == "passwd":
                      if rest[:1] == ["--init"]:
                          if load_cfg()["pw_hash"]:
                              return
                          rest = []
                      pw = rest[0] if rest else secrets.token_urlsafe(9)
                      if len(pw) < 6:
                          sys.exit("Password minimal 6 karakter")
                      set_password(pw)
                      print(pw if not rest else "Password diganti")
                  elif cmd == "config":
                      if rest[:1] == ["set"] and len(rest) == 3:
                          apply_settings({rest[1]: rest[2]})
                      else:
                          c = load_cfg()
                          print(json.dumps({k: c[k] for k in SETTABLE}, indent=2))
                  elif cmd == "eula":
                      SERVER.mkdir(parents=True, exist_ok=True)
                      (SERVER / "eula.txt").write_text("# Disetujui lewat installer (https://aka.ms/MinecraftEULA)\neula=true\n")
                  elif cmd == "backup":
                      cli_tail()
                      print(create_backup("manual"))
                  elif cmd == "tunnel":
                      act = rest[0] if rest else "show"
                      if act == "install":
                          install_playit()
                      if act in ("install", "start"):
                          if not (TUNNEL / "playit").exists():
                              install_playit()
                          if act == "start":
                              start_tunnel()
                              print("Tunnel jalan. Lihat: mc tunnel show")
                      elif act == "stop":
                          tmux("kill-session", "-t", f"={S_TUN}")
                      else:
                          s = tunnel_state()
                          print(s["output"] or "Tunnel belum jalan")
                          if s["claim"]:
                              print("\nBuka link ini untuk klaim agent:", s["claim"])
                  else:
                      print("Perintah tidak dikenal:", cmd)
                      sys.exit(2)
              except ApiError as e:
                  sys.exit(f"Error: {e.msg}")
              except urllib.error.URLError as e:
                  sys.exit(f"Tidak bisa terhubung ke internet/server luar: {getattr(e, 'reason', e)}")


          if __name__ == "__main__":
              main(sys.argv)
          __EOF_PANEL_PY__

